<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="设备管理">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>车间设备管理</title>
<style>
:root,[data-theme=light]{--bg:#f4f6fa;--card:#fff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--primary:#2563eb;--primary-d:#1e40af;--green:#16a34a;--orange:#f59e0b;--red:#dc2626;--radius:14px;--primary-soft:rgba(37,99,235,.12)}
[data-theme=dark]{--bg:#0f1115;--card:#171a21;--text:#e5e7eb;--sub:#9ca3af;--line:#262b35;--primary:#3b82f6;--primary-d:#2563eb;--primary-soft:rgba(59,130,246,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hdr{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;flex:none;z-index:10;padding:calc(env(safe-area-inset-top) + 6px) 8px 9px;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff}
#hdr h1{font-size:17px;margin:0;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:6px}.hdr-r{justify-content:flex-end}
.ico-btn{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
#tabbar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;border:0;background:none;padding:7px 0 6px;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#tabbar button .ic{font-size:19px;line-height:1}
#tabbar button.on{color:var(--primary);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.sec-title{font-size:13px;color:var(--sub);margin:16px 4px 8px;display:flex;align-items:center;gap:6px;font-weight:600}
.sec-title:first-child{margin-top:0}
.sec-title .mini-tip{font-size:11px;color:var(--sub);font-weight:400;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .n{font-size:25px;font-weight:700;color:var(--primary);line-height:1.2}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--text);font-family:inherit}
.quick .ic{font-size:20px;line-height:1}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.item:active{background:var(--line)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .s{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-lg{width:38px;height:38px;flex:none;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden}
.ic-lg img{width:100%;height:100%;object-fit:cover}
.chev{color:var(--sub);font-size:19px;flex:none}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}.b-red{background:#fee2e2;color:#b91c1c}.b-orange{background:#fef3c7;color:#b45309}.b-blue{background:#dbeafe;color:#1d4ed8}.b-gray{background:#f3f4f6;color:#6b7280}
[data-theme=dark] .b-green{background:rgba(22,163,74,.22);color:#4ade80}
[data-theme=dark] .b-red{background:rgba(220,38,38,.22);color:#f87171}
[data-theme=dark] .b-orange{background:rgba(245,158,11,.22);color:#fbbf24}
[data-theme=dark] .b-blue{background:rgba(37,99,235,.22);color:#60a5fa}
[data-theme=dark] .b-gray{background:rgba(107,114,128,.22);color:#9ca3af}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:36px 10px}
.hint{font-size:12px;color:var(--sub);padding:2px 4px 10px}
.muted-sm{font-size:12px;color:var(--sub);padding:0 4px 8px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-family:inherit;background:var(--primary);color:#fff;font-weight:600;flex:1}
.btn:active{opacity:.8}
.btn.wide{width:100%;display:block}
.btn.gray{background:var(--line);color:var(--text)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.danger{color:var(--red)}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;border:0;box-shadow:0 6px 20px rgba(37,99,235,.45);z-index:20;line-height:1;padding-bottom:2px}
.searchbar{display:flex;gap:8px;margin-bottom:8px}
.searchbar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit}
.row{display:flex;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.row:last-child{border-bottom:0}
.row .k{color:var(--sub);flex:none;width:76px}
.row .v{flex:1;word-break:break-all}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none}
.field textarea{min-height:72px;resize:vertical}
#modal{position:fixed;inset:0;display:none;z-index:100}
#modal.on{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;max-height:90vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;border-bottom:1px solid var(--line);flex:none}
.sheet-hd button{background:none;border:0;font-size:18px;color:var(--sub)}
.sheet-bd{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:12px 16px;border-top:1px solid var(--line);flex:none}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check-t{flex:1;font-size:14px}
.check-note{flex-basis:100%;padding:7px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg-b{border:0;background:var(--card);color:var(--sub);font-size:12px;padding:5px 13px;font-family:inherit}
.seg-b+.seg-b{border-left:1px solid var(--line)}
.seg-b.on[data-val=正常]{background:#16a34a;color:#fff}
.seg-b.on[data-val=异常]{background:#dc2626;color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;padding:0}
.ph-add{width:74px;height:74px;border-radius:10px;border:1px dashed var(--line);background:var(--card);color:var(--sub);font-size:24px;display:flex;align-items:center;justify-content:center}
.chk{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--primary)}
.chk em{color:var(--sub);font-style:normal;font-size:12px}
.pick-list{max-height:56vh;overflow-y:auto}
.hero{width:100%;max-height:230px;object-fit:cover;border-radius:var(--radius);margin-bottom:10px;display:block}
table.rep{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
table.rep th{background:var(--bg);color:var(--sub);font-weight:600;padding:8px 6px;text-align:left;white-space:nowrap}
table.rep td{padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.scan-ov{position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center}
.scan-ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:relative;width:245px;height:245px;border:2px solid #4ade80;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);z-index:1}
.scan-tip{position:absolute;bottom:130px;color:#fff;font-size:14px;z-index:2}
.scan-cancel{position:absolute;bottom:56px;background:rgba(255,255,255,.22);border:0;color:#fff;padding:11px 34px;border-radius:22px;font-size:15px;z-index:2;font-family:inherit}
.tagbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.tagbar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;padding:6px 14px;font-size:13px;font-family:inherit}
.tagbar button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.mini-btn{border:0;background:var(--green);color:#fff;font-size:11px;padding:5px 11px;border-radius:14px;font-family:inherit;font-weight:600;flex:none}
.ci-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ci-idx{width:20px;text-align:center;font-size:12px;color:var(--sub);flex:none;font-weight:600}
.ci-input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;min-width:0}
.ci-move{width:28px;height:28px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;line-height:1;padding:0}
.ci-move:active{background:var(--primary);color:#fff;border-color:var(--primary)}
.ci-del{width:28px;height:28px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--red);font-size:16px;line-height:1;padding:0}
.quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.quick-chips button{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:14px;padding:4px 11px;font-size:12px;font-family:inherit}
.quick-chips button:active,.quick-chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hdr-note{font-size:12px;color:var(--sub);padding:2px 4px 8px;display:flex;align-items:center;gap:5px}
.tmpl-row{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.tmpl-head{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tmpl-name{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;min-width:0}
.tmpl-text{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;min-height:52px;resize:vertical}
.pd-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pd-input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;min-width:0;text-align:center}
.period-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);margin-right:4px;vertical-align:1px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:rgba(17,24,39,.93);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:500;opacity:0;pointer-events:none;transition:all .22s;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);color:#b45309;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
[data-theme=dark] .banner{color:#fbbf24}
.route-banner{display:flex;align-items:center;gap:8px;background:var(--primary-soft);border:1px solid var(--primary);color:var(--primary);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px;font-weight:600}
.route-banner .rb-exit{margin-left:auto;background:transparent;border:1px solid var(--primary);color:var(--primary);font-size:12px;padding:3px 10px;border-radius:14px;font-family:inherit}
.today{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
.today .tl{font-size:12px;opacity:.85;margin-bottom:2px}
.today .tv{font-size:20px;font-weight:700;line-height:1.1}
.today .tsep{width:1px;height:34px;background:rgba(255,255,255,.25)}
.today .titem{flex:1;text-align:center}
.gs-group{margin-bottom:14px}
.gs-group h4{font-size:12px;color:var(--sub);margin:0 0 8px;font-weight:600;letter-spacing:.5px}
.ref-btn{border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);font-size:12px;padding:5px 11px;border-radius:14px;font-family:inherit;font-weight:600;margin-left:auto}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.tl-item:active{background:var(--bg)}
.tl-item::before{content:"";position:absolute;left:-21px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.tl-item.tl-mr::before{background:var(--green)}
.tl-item.tl-rp::before{background:var(--orange)}
.tl-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tl-date{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400}
.tl-body{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.qr-card{background:#fff;color:#000;border:1px solid #000;border-radius:8px;padding:14px;text-align:center;font-family:"Courier New",monospace}
.qr-card .qr-name{font-size:18px;font-weight:700;font-family:-apple-system,sans-serif}
.qr-card .qr-code{margin:8px 0;display:flex;justify-content:center;align-items:flex-end;gap:1px;height:66px}
.qr-card .qr-code i{display:block;width:2px;background:#000}
.qr-card .qr-code i.w{background:transparent}
.qr-card .qr-num{font-size:20px;font-weight:700;letter-spacing:2px;font-family:"Courier New",monospace}
.qr-card .qr-meta{font-size:11px;color:#666;margin-top:6px}
.qr-hint{font-size:11px;color:var(--sub);margin-top:8px;text-align:center}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.rank-row:last-child{border-bottom:0}
.rank-idx{width:22px;height:22px;line-height:22px;text-align:center;font-size:11px;font-weight:700;border-radius:50%;background:var(--bg);color:var(--sub);flex:none}
.rank-idx.top{background:var(--red);color:#fff}
.rank-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-val{font-size:12px;color:var(--sub);flex:none;margin-left:auto}
.rank-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.rank-bar>i{display:block;height:100%;background:var(--red);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <nav id="tabbar"></nav>
</div>
<div id="modal"></div>
<input type="file" id="filePhoto" accept="image/*" hidden multiple>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   车间设备管理 PWA —— v1.6 完全离线
   新增：设备二维码卡片 / 巡检异常筛选 / 保养一键顺延
        异常设备排行 / 单设备档案导出 / 常用短语增强
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const today=()=>fmtD(new Date());
const daysTo=d=>Math.ceil((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return fmtD(x)};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
let toastTimer=null;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function lightbox(src){const ov=document.createElement('div');ov.className='lightbox';ov.innerHTML=`<img src="${src}"><button>✕</button>`;ov.addEventListener('click',()=>ov.remove());document.body.appendChild(ov)}

/* ---------- 主题 ---------- */
function applyTheme(){
  const t=DB_DATA.settings.theme||'auto';
  const dark=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?'#0f1115':'#2563eb';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((DB_DATA.settings.theme||'auto')==='auto')applyTheme()});

/* ---------- 数据层 ---------- */
const STORES=['devices','inspections','mrecords','maintenances','repairs','routes','settings'];
const DEF_CHECK=['设备外观','运行状态','异响振动','温度','润滑情况','仪表指示','安全防护','环境卫生'];
const DEF_PERIODS=[7,15,30,90,180];
const DEF_TMPL=[
  {name:'通用保养',text:'更换机油、清洁滤芯、检查皮带松紧'},
  {name:'润滑保养',text:'加注润滑脂、检查油位、紧固螺栓'},
  {name:'清洁保养',text:'清洁散热器、检查风扇、清理过滤网'},
  {name:'电气检查',text:'检查接线端子、测量绝缘电阻、紧固电气连接'}
];

let PH=[];
function compressImage(file){
  return new Promise((res,rej)=>{
    const{max,q}=getPhotoParams();
    const img=new Image();const fr=new FileReader();
    fr.onload=()=>{img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- 扫码 ---------- */
function scanCode(){
  return new Promise(async resolve=>{
    if(!window.BarcodeDetector){const v=prompt('当前环境不支持摄像头扫码，\n请手动输入设备编号：');return resolve(v?v.trim():null)}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})}catch(e){const v=prompt('无法访问摄像头，请手动输入设备编号：');return resolve(v?v.trim():null)}
    const ov=document.createElement('div');ov.className='scan-ov';
    ov.innerHTML=`<video playsinline autoplay muted></video><div class="scan-box"></div><div class="scan-tip">将设备二维码放入框内</div><button class="scan-cancel">取消</button>`;
    document.body.appendChild(ov);
    const video=ov.querySelector('video');video.srcObject=stream;try{await video.play()}catch(e){}
    let detector;try{detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8']})}catch(e){detector=new BarcodeDetector()}
    let done=false;
    const stop=v=>{if(done)return;done=true;try{stream.getTracks().forEach(t=>t.stop())}catch(e){}ov.remove();resolve(v)};
    ov.querySelector('.scan-cancel').onclick=()=>stop(null);
    const loop=async()=>{if(done)return;try{const cs=await detector.detect(video);if(cs&&cs.length)return stop(cs[0].rawValue)}catch(e){}setTimeout(loop,280)};
    loop();
  });
}

/* ---------- 计算函数 ---------- */
function lastInspectionDate(id){let last=null;for(const r of DB_DATA.inspections){if(r.deviceId===id&&(!last||(r.date||'')>last))last=r.date}return last}
function dueInspectionList(){
  const out=[];
  DB_DATA.devices.forEach(d=>{
    if(d.status==='停用'||d.status==='报废')return;
    const period=deviceInspectPeriod(d);const last=lastInspectionDate(d.id);
    const base=last||d.startDate||today();const gap=-daysTo(base);
    if(gap>=period)out.push({device:d,last,gap,period,overdue:gap-period});
  });
  return out.sort((a,b)=>b.overdue-a.overdue);
}
function inspectStatusOf(d){
  const period=deviceInspectPeriod(d);const last=lastInspectionDate(d.id);
  if(!last)return{txt:'尚未巡检',cls:'b-red',period,last:null,gap:null};
  const gap=-daysTo(last);
  if(gap>=period)return{txt:`已逾期 ${gap-period} 天`,cls:'b-red',period,last,gap};
  const left=period-gap;
  return{txt:`${left} 天后巡检`,cls:left<=2?'b-orange':'b-green',period,last,gap};
}
function todayStats(){const t=today();return{insp:DB_DATA.inspections.filter(x=>x.date===t).length,mr:DB_DATA.mrecords.filter(x=>x.date===t).length,rep:DB_DATA.repairs.filter(x=>x.reportDate===t).length}}
function deviceTimeline(id,limit=30){
  const ev=[];
  DB_DATA.inspections.filter(x=>x.deviceId===id).forEach(x=>ev.push({type:'insp',date:x.date,ts:x.createdAt||0,icon:'🔍',label:'巡检',title:(x.items||[]).some(i=>i.result==='异常')?'发现异常':'全部正常',body:(x.items||[]).filter(i=>i.result==='异常').map(i=>i.name).join('、')||'',ref:x}));
  DB_DATA.mrecords.filter(x=>x.deviceId===id).forEach(x=>ev.push({type:'mr',date:x.date,ts:0,icon:'🧰',label:'保养',title:x.content||'执行保养',body:[x.parts?'配件：'+x.parts:'',x.cost?'费用：'+x.cost+' 元':''].filter(Boolean).join(' · '),ref:x}));
  DB_DATA.repairs.filter(x=>x.deviceId===id).forEach(x=>ev.push({type:'rp',date:x.reportDate,ts:x.createdAt||0,icon:'🔧',label:'维修',title:x.fault||'报修',body:`状态：${x.status}${x.repairer?' · 维修人：'+x.repairer:''}${x.cost?' · '+x.cost+' 元':''}`,ref:x}));
  return ev.sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,limit);
}
function globalSearch(q){
  q=(q||'').toLowerCase().trim();
  if(!q)return{devices:[],inspections:[],repairs:[],maintenances:[]};
  return{
    devices:DB_DATA.devices.filter(d=>[d.name,d.code,d.model,d.location,d.owner].join(' ').toLowerCase().includes(q)).slice(0,8),
    inspections:DB_DATA.inspections.filter(r=>[r.deviceName,r.by,r.date].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8),
    repairs:DB_DATA.repairs.filter(r=>{const d=DB_DATA.devices.find(x=>x.id===r.deviceId);return[d?d.name:'',r.fault,r.reporter,r.repairer].join(' ').toLowerCase().includes(q)}).sort((a,b)=>String(b.reportDate).localeCompare(String(a.reportDate))).slice(0,8),
    maintenances:DB_DATA.maintenances.filter(p=>{const d=DB_DATA.devices.find(x=>x.id===p.deviceId);return[d?d.name:'',p.content].join(' ').toLowerCase().includes(q)}).slice(0,8)
  };
}

/* ---------- 设备二维码卡片渲染 ---------- */
function renderBarcode(text){
  const chars=String(text||'0000').padEnd(8,'0');
  let bars='';
  for(let i=0;i<chars.length;i++){
    const code=chars.charCodeAt(i);
    for(let j=0;j<6;j++){
      const w=(code>>j)&1;
      bars+=`<i class="${w?'':'w'}"></i>`;
    }
    bars+='<i class="w"></i>';
  }
  return bars;
}

function inspItem(r){

}
function filterInspections(q,f){
  let l=DB_DATA.inspections.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(f==='异常')l=l.filter(r=>(r.items||[]).some(i=>i.result==='异常'));
  else if(f==='正常')l=l.filter(r=>!(r.items||[]).some(i=>i.result==='异常'));
  if(q)l=l.filter(r=>[r.deviceName,r.by,r.date].join(' ').toLowerCase().includes(q));
  return l;
}

async function saveInspection(deviceId){
  const d=DB_DATA.devices.find(x=>x.id===deviceId);
  if(!d)return;
  const items=$$('#checkList .check').map(el=>{const on=el.querySelector('.seg-b.on');const note=el.querySelector('.check-note');return{name:el.dataset.name,result:on?on.dataset.val:'正常',note:note?note.value.trim():''}});
  const date=$('#insDate').value||today();
  const by=$('#insBy').value.trim();
  const rec={id:uid(),deviceId:d.id,deviceName:d.name,date,by,items,remark:$('#insRemark').value.trim(),photos:PH.slice(),createdAt:Date.now()};
  await save('inspections',rec);
  if(by)await save('settings',{inspector:by});
  PH=[];
  if(state.routeQueue&&state.routeQueue.ids.length){
    state.routeQueue.idx++;
    if(state.routeQueue.idx<state.routeQueue.ids.length){
      const nextId=state.routeQueue.ids[state.routeQueue.idx];
      nav.stack.pop();go('inspectRun',{id:nextId});
      toast(`已完成 ${state.routeQueue.idx}/${state.routeQueue.ids.length}，继续下一台`);
      return;
    }else{
      const total=state.routeQueue.ids.length;const rname=state.routeQueue.name;
      state.routeQueue=null;nav.stack.pop();render();
      toast(`路线「${rname}」全部完成，共 ${total} 台`);
      return;
    }
  }
  const period=deviceInspectPeriod(d);
  toast(`巡检已保存，下次巡检日期 ${addDays(date,period)}`);
  back();
}

/* ---------- 保养 ---------- */
function maintStatus(p){
  if(!p.nextDate)return{txt:'未设置',cls:'b-gray'};
  const d=daysTo(p.nextDate);
  if(d<0)return{txt:`已逾期 ${-d} 天`,cls:'b-red'};
  if(d===0)return{txt:'今日到期',cls:'b-orange'};
  if(d<=7)return{txt:`${d} 天后到期`,cls:'b-orange'};
  return{txt:`${d} 天后`,cls:'b-green'};
}

const REP_STATUS=['待处理','处理中','已完成'];
function repItem(r){
  const d=DB_DATA.devices.find(x=>x.id===r.deviceId);
  const cls=r.status==='待处理'?'b-red':r.status==='处理中'?'b-orange':'b-green';

function filterRepairs(q,f){
  let l=DB_DATA.repairs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(f&&f!=='全部')l=l.filter(r=>r.status===f);
  if(q)l=l.filter(r=>{const d=DB_DATA.devices.find(x=>x.id===r.deviceId);return[d?d.name:'',r.fault,r.reporter,r.repairer].join(' ').toLowerCase().includes(q)});
  return l;
}
function updateRepairList(){

  const el=$('#repList');if(el)el.innerHTML=list.length?list.map(repItem).join(''):'<div class="empty">未找到匹配工单</div>';
  const c=$('#repCount');if(c)c.textContent=`共 ${list.length} 条工单`;

/* ---------- 统计报告（含异常设备排行） ---------- */
function buildStatRows(from,to){
  const D=DB_DATA;const inR=d=>d&&d>=from&&d<=to;
  return D.devices.map(d=>{
    const ins=D.inspections.filter(x=>x.deviceId===d.id&&inR(x.date));
    const abn=ins.filter(x=>(x.items||[]).some(i=>i.result==='异常')).length;
    const mr=D.mrecords.filter(x=>x.deviceId===d.id&&inR(x.date)).length;
    const rp=D.repairs.filter(x=>x.deviceId===d.id&&inR(x.reportDate));
    const cost=rp.reduce((s,x)=>s+num(x.cost),0);
    return{id:d.id,name:d.name,code:d.code,insp:ins.length,abn,mr,rep:rp.length,cost};
  }).filter(r=>r.insp||r.mr||r.rep);
}
function monthlyTrend(months){
  const res=[];const now=new Date();
  for(let i=months-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const insp=DB_DATA.inspections.filter(x=>(x.date||'').startsWith(key)).length;
    const mr=DB_DATA.mrecords.filter(x=>(x.date||'').startsWith(key)).length;
    const rp=DB_DATA.repairs.filter(x=>(x.reportDate||'').startsWith(key));
    res.push({key,insp,mr,rep:rp.length,cost:rp.reduce((s,x)=>s+num(x.cost),0)});
  }
  return res;
}

        <div class="field"><label>主题</label><select id="setTheme"><option value="auto" ${s.theme==='auto'?'selected':''}>跟随系统</option><option value="light" ${s.theme==='light'?'selected':''}>始终浅色</option><option value="dark" ${s.theme==='dark'?'selected':''}>始终深色</option></select></div>

      <div class="sec-title">巡检检查项<span class="mini-tip">共 <span id="ciCount">${items.length}</span> 项</span></div>
      <div class="card"><div id="ciEditor">${items.map((it,i)=>ciRowHTML(it,i+1)).join('')}</div>

        <button class="btn ghost wide" style="margin-top:8px;color:var(--sub)" data-act="resetCheckItems">恢复默认检查项</button>
      </div>
      <div class="sec-title">保养周期快捷选项<span class="mini-tip">共 <span id="pdCount">${periods.length}</span> 项</span></div>
      <div class="card"><div id="pdEditor">${periods.map(v=>pdRowHTML(v)).join('')}</div>
        <button class="btn ghost wide" style="margin-top:6px" data-act="addMaintPeriod">＋ 添加周期选项</button>
        <button class="btn ghost wide" style="margin-top:8px;color:var(--sub)" data-act="resetMaintPeriods">恢复默认周期</button>
      </div>
      <div class="sec-title">保养内容模板<span class="mini-tip">共 <span id="tmplCount">${templates.length}</span> 条</span></div>
      <div class="card"><div id="tmplEditor">${templates.map(t=>tmplRowHTML(t)).join('')}</div>
        <button class="btn ghost wide" style="margin-top:6px" data-act="addMaintTemplate">＋ 添加模板</button>
        <button class="btn ghost wide" style="margin-top:8px;color:var(--sub)" data-act="resetMaintTemplates">恢复默认模板</button>
      </div>
      <div class="sec-title">维修常用短语<span class="mini-tip">共 <span id="phrCount">${phrases.length}</span> 条</span></div>
      <div class="card"><div id="phrEditor">${phrases.map(p=>phraseRowHTML(p)).join('')}</div>
        <button class="btn ghost wide" style="margin-top:6px" data-act="addRepairPhrase">＋ 添加短语</button>
        <button class="btn ghost wide" style="margin-top:8px;color:var(--sub)" data-act="resetRepairPhrases">恢复默认短语</button>
      </div>
      <button class="btn wide" data-act="saveSettings">保存全部设置</button>
      <div class="sec-title">关于</div>
      <div class="card" style="font-size:13px;color:var(--sub);line-height:1.8">
        <b style="color:var(--text)">车间设备管理 v1.6</b><br>
        · 完全离线运行，数据仅保存在本机浏览器数据库<br>
        · 支持添加到 iPhone 主屏幕，像 App 一样使用<br>
        · 支持扫码巡检、二维码卡片、参照上次、连续巡检<br>
        · 巡检项 / 保养周期 / 保养模板 / 维修短语均可自定义<br>
        · 支持深色模式、全局搜索、数据清理、异常排行<br>
        · 请定期导出备份
      </div>
    `;
  }
};

/* =========================================================
   动作分发
   ========================================================= */
const ACTIONS={
  back:()=>back(),
  closeSheet:()=>closeSheet(),
  tab:el=>setRoot(el.dataset.page),
  nav:el=>setRoot(el.dataset.page),
  goto:el=>go(el.dataset.page,el.dataset.id?{id:el.dataset.id}:{}),
  help:()=>helpSheet(),
  openSearch:()=>openSearchSheet(),

    const t=el.dataset.type,id=el.dataset.id;

    else if(t==='mr')viewMRecord(id);
    else if(t==='rp')viewRepair(id);
  },
  searchGo:el=>{
    const t=el.dataset.t,id=el.dataset.id;closeSheet();
    setTimeout(()=>{
      if(t==='device')go('device',{id});
      else if(t==='inspection')viewInspection(id);
      else if(t==='repair')viewRepair(id);
      else if(t==='maintenance')planDetail(id);
    },140);
  },
  addDevice:()=>deviceForm(),
  editDevice:el=>deviceForm(el.dataset.id),
  saveDevice:()=>saveDeviceForm(),
  delDevice:el=>delDevice(el.dataset.id),
  setDevPeriod:el=>{$('#dvInspPeriod').value=el.dataset.v;$$('.quick-chips button[data-act="setDevPeriod"]').forEach(b=>b.classList.toggle('on',b===el))},
  clearDevPeriod:()=>{$('#dvInspPeriod').value='';$$('.quick-chips button[data-act="setDevPeriod"]').forEach(b=>b.classList.remove('on'))},
  showQR:el=>showQR(el.dataset.id),
  exportDeviceArchive:el=>exportDeviceArchive(el.dataset.id),
  scanDevice:async()=>{const c=await scanCode();if(!c)return;const d=findDeviceByCode(c);if(d)go('device',{id:d.id});else if(confirm(`未找到编号为「${c}」的设备，是否新增？`))deviceForm()},
  scanAndInspect:async()=>{const c=await scanCode();if(!c)return;const d=findDeviceByCode(c);if(d){closeSheet();go('inspectRun',{id:d.id})}else toast('未找到匹配设备：'+c)},
  pickInspect:()=>pickInspect(),
  inspFilter:el=>{state.inspFilter=el.dataset.v;render()},
  saveInspection:el=>saveInspection(el.dataset.id),
  viewInspection:el=>viewInspection(el.dataset.id),
  delInspection:async el=>{if(!confirm('确定删除这条巡检记录？'))return;await remove('inspections',el.dataset.id);closeSheet();toast('已删除');render()},
  startInspect:el=>go('inspectRun',{id:el.dataset.id}),
  fillFromLast:()=>{
    const box=$('#checkList');if(!box)return;
    let items;try{items=JSON.parse(box.dataset.lastrec||'[]')}catch(e){items=[]}
    if(!items.length){toast('该设备没有历史巡检记录');return}
    let filled=0;
    $$('#checkList .check').forEach(el=>{
      const l=items.find(x=>x.name===el.dataset.name);if(!l)return;
      el.querySelectorAll('.seg-b').forEach(b=>b.classList.toggle('on',b.dataset.val===l.result));
      const note=el.querySelector('.check-note');if(note)note.value=l.note||'';
      filled++;
    });
    toast(`已参照上次填写 ${filled} 项`);
  },
  allNormal:()=>{
    $$('#checkList .check').forEach(el=>{
      el.querySelectorAll('.seg-b').forEach(b=>b.classList.toggle('on',b.dataset.val==='正常'));
    });
    toast('已全部标为正常');
  },
  cancelRoute:()=>{state.routeQueue=null;nav.stack.pop();render();toast('已退出连续巡检')},
  maintTab:el=>{state.maintFilter=el.dataset.v;render()},
  addPlan:()=>planForm(),
  editPlan:el=>{closeSheet();setTimeout(()=>planForm(el.dataset.id),120)},
  savePlan:()=>savePlanForm(),
  planDetail:el=>planDetail(el.dataset.id),
  delPlan:async el=>{if(!confirm('确定删除该保养计划？'))return;await remove('maintenances',el.dataset.id);closeSheet();toast('已删除');render()},
  execMaint:el=>{closeSheet();setTimeout(()=>execMaintForm(el.dataset.id),120)},
  startMaint:async el=>{
    let p=DB_DATA.maintenances.find(x=>x.deviceId===el.dataset.id);
    if(!p){p={id:uid(),deviceId:el.dataset.id,period:30,content:'',lastDate:today(),nextDate:addDays(today(),30),remark:''};await save('maintenances',p)}
    execMaintForm(p.id);
  },
  skipMaint:async el=>{
    const p=DB_DATA.maintenances.find(x=>x.id===el.dataset.id);
    if(!p)return;
    if(!confirm(`顺延「${p.content||'本次保养'}」一个周期（${p.period} 天）？\n下次日期将改为 ${addDays(today(),p.period)}`))return;
    p.nextDate=addDays(today(),p.period);
    await save('maintenances',p);
    toast('已顺延至 '+p.nextDate);render();
  },
  skipMaintFromDetail:async el=>{
    const p=DB_DATA.maintenances.find(x=>x.id===el.dataset.id);
    if(!p)return;
    if(!confirm(`顺延一个周期（${p.period} 天）？`))return;
    p.nextDate=addDays(today(),p.period);
    await save('maintenances',p);
    closeSheet();toast('已顺延至 '+p.nextDate);render();
  },
  setMaintPeriod:el=>{
    const v=el.dataset.v;$('#mpPeriod').value=v;
    const last=$('#mpLast').value||today();
    $('#mpNext').value=addDays(last,parseInt(v,10));
    $$('#periodChips button').forEach(b=>b.classList.toggle('on',b===el));
  },
  setMaintContent:el=>{
    const i=parseInt(el.dataset.i,10);
    const t=getMaintTemplates()[i];if(!t)return;
    $('#mpContent').value=t.text||'';
    $$('#contentChips button').forEach(b=>b.classList.toggle('on',b===el));
  },
  saveMRecord:()=>saveMRecord(),
  viewMRecord:el=>viewMRecord(el.dataset.id),
  delMRecord:async el=>{if(!confirm('确定删除该保养记录？'))return;await remove('mrecords',el.dataset.id);closeSheet();toast('已删除');render()},
  newRepair:el=>repairForm(null,el.dataset.id),
  editRepair:el=>{closeSheet();setTimeout(()=>repairForm(el.dataset.id),120)},
  saveRepair:()=>saveRepairForm(),
  viewRepair:el=>viewRepair(el.dataset.id),
  delRepair:async el=>{if(!confirm('确定删除该维修工单？'))return;await remove('repairs',el.dataset.id);closeSheet();toast('已删除');render()},
  repFilter:el=>{state.repairFilter=el.dataset.v;render()},
  setRepairPhrase:el=>{
    const i=parseInt(el.dataset.i,10);
    const p=getRepairPhrases()[i];if(!p)return;
    const ta=$('#rpFault');if(!ta)return;
    ta.value=ta.value?ta.value+'、'+p:p;
    $$('#faultChips button').forEach(b=>b.classList.toggle('on',b===el));
  },
  quickFinish:async el=>{
    const r=DB_DATA.repairs.find(x=>x.id===el.dataset.id);
    if(!r)return;
    r.status='已完成';r.finishDate=r.finishDate||today();
    await save('repairs',r);
    const dev=DB_DATA.devices.find(x=>x.id===r.deviceId);
    if(dev&&dev.status==='维修中'){dev.status='正常';await save('devices',dev)}
    toast('工单已完成');render();
  },
  addRoute:()=>routeForm(),
  editRoute:el=>{closeSheet();setTimeout(()=>routeForm(el.dataset.id),120)},
  saveRoute:()=>saveRouteForm(),
  routeDetail:el=>routeDetail(el.dataset.id),
  delRoute:async el=>{if(!confirm('确定删除该路线？'))return;await remove('routes',el.dataset.id);closeSheet();toast('已删除');render()},
  routeInspect:el=>{closeSheet();setTimeout(()=>go('inspectRun',{id:el.dataset.id}),150)},
  routeStartAll:el=>{
    const r=DB_DATA.routes.find(x=>x.id===el.dataset.id);
    if(!r||!r.deviceIds||!r.deviceIds.length){toast('该路线暂无设备');return}
    const ids=r.deviceIds.filter(id=>DB_DATA.devices.some(d=>d.id===id));
    if(!ids.length){toast('该路线暂无有效设备');return}
    state.routeQueue={ids,idx:0,name:r.name};
    closeSheet();
    setTimeout(()=>go('inspectRun',{id:ids[0]}),150);
  },
  applyStat:()=>{state.statFrom=$('#stFrom').value;state.statTo=$('#stTo').value;render()},
  exportStatExcel:()=>{
    const from=state.statFrom||(today().slice(0,8)+'01');
    const to=state.statTo||today();
    const rows=buildStatRows(from,to);
    exportExcel(`设备统计报告_${from}_${to}`,`设备管理统计报告（${from} 至 ${to}）`,['设备名称','设备编号','巡检次数','异常次数','保养次数','维修次数','维修费用(元)'],rows.map(r=>[r.name,r.code||'',r.insp,r.abn,r.mr,r.rep,r.cost.toFixed(2)]));
  },
  exportStatWord:()=>{
    const from=state.statFrom||(today().slice(0,8)+'01');
    const to=state.statTo||today();
    const rows=buildStatRows(from,to);
    const totalInsp=rows.reduce((s,r)=>s+r.insp,0);
    const totalAbn=rows.reduce((s,r)=>s+r.abn,0);
    const totalMr=rows.reduce((s,r)=>s+r.mr,0);
    const totalRep=rows.reduce((s,r)=>s+r.rep,0);
    const totalCost=rows.reduce((s,r)=>s+r.cost,0);
    const topAbn=rows.slice().filter(r=>r.abn>0).sort((a,b)=>b.abn-a.abn).slice(0,5);
    const inner=`
      <p>车间：${esc(DB_DATA.settings.workshop||'—')}　统计区间：${from} 至 ${to}</p>
      <p><b>汇总：</b>巡检 ${totalInsp} 次，异常 ${totalAbn} 项次，保养 ${totalMr} 次，维修 ${totalRep} 单，维修费用合计 ${totalCost.toFixed(2)} 元。</p>
      ${topAbn.length?`<p><b>异常设备排行：</b></p>${rowsToTable(['排名','设备','异常次数'],topAbn.map((r,i)=>[i+1,r.name,r.abn]))}`:''}
      <p><b>按设备明细：</b></p>
      ${rowsToTable(['设备名称','设备编号','巡检次数','异常次数','保养次数','维修次数','维修费用(元)'],rows.map(r=>[r.name,r.code||'',r.insp,r.abn,r.mr,r.rep,r.cost.toFixed(2)]))}`;
    exportWord(`设备统计报告_${from}_${to}`,'设备管理统计报告',inner);
  },
  devExcel:()=>exportExcel(`设备台账_${today()}`,'设备台账',['设备名称','设备编号','规格型号','安装位置','责任人','启用日期','巡检周期(天)','状态','备注'],DB_DATA.devices.map(d=>[d.name,d.code||'',d.model||'',d.location||'',d.owner||'',d.startDate||'',d.inspectPeriod||'跟随全局',d.status||'',d.remark||''])),
  devWord:()=>exportWord(`设备台账_${today()}`,'设备台账',rowsToTable(['设备名称','设备编号','规格型号','安装位置','责任人','巡检周期(天)','状态'],DB_DATA.devices.map(d=>[d.name,d.code||'',d.model||'',d.location||'',d.owner||'',d.inspectPeriod||'跟随全局',d.status||'']))),
  insExcel:()=>exportExcel(`巡检记录_${today()}`,'巡检记录',['日期','设备名称','巡检人','异常项','全部检查项','备注'],DB_DATA.inspections.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{const abn=(r.items||[]).filter(i=>i.result==='异常');return[r.date,r.deviceName,r.by||'',abn.map(i=>i.name).join('、'),(r.items||[]).map(i=>`${i.name}:${i.result}`).join('；'),r.remark||'']})),
  mrExcel:()=>exportExcel(`保养记录_${today()}`,'保养记录',['日期','设备名称','保养人','保养内容','更换配件','费用(元)','备注'],DB_DATA.mrecords.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>[r.date,r.deviceName||'',r.by||'',r.content||'',r.parts||'',r.cost||0,r.remark||''])),
  planExcel:()=>exportExcel(`保养计划_${today()}`,'保养计划',['设备名称','设备编号','保养周期(天)','上次保养','下次保养','保养内容'],DB_DATA.maintenances.map(p=>{const d=DB_DATA.devices.find(x=>x.id===p.deviceId);return[d?d.name:'',d?(d.code||''):'',p.period||'',p.lastDate||'',p.nextDate||'',p.content||'']})),
  rpExcel:()=>exportExcel(`维修工单_${today()}`,'维修工单',['报修日期','设备名称','故障描述','报修人','状态','维修人','处理结果','费用(元)','完成日期'],DB_DATA.repairs.slice().sort((a,b)=>String(b.reportDate).localeCompare(String(a.reportDate))).map(r=>{const d=DB_DATA.devices.find(x=>x.id===r.deviceId);return[r.reportDate,d?d.name:'',r.fault,r.reporter||'',r.status,r.repairer||'',r.result||'',r.cost||0,r.finishDate||'']})),
  routeWord:()=>{
    const inner=DB_DATA.routes.map(r=>{const devs=(r.deviceIds||[]).map(id=>DB_DATA.devices.find(d=>d.id===id)).filter(Boolean);return `<h3>${esc(r.name)}</h3>${rowsToTable(['序号','设备名称','设备编号','安装位置'],devs.map((d,i)=>[i+1,d.name,d.code||'',d.location||'']))}`}).join('')||'<p>暂无巡检路线</p>';
    exportWord(`巡检路线_${today()}`,'巡检路线清单',inner);
  },
  allWord:()=>{
    const D=DB_DATA;
    const inner=`
      <h3>一、设备台账（${D.devices.length} 台）</h3>${rowsToTable(['设备名称','设备编号','规格型号','安装位置','责任人','巡检周期(天)','状态'],D.devices.map(d=>[d.name,d.code||'',d.model||'',d.location||'',d.owner||'',d.inspectPeriod||'跟随全局',d.status||'']))}
      <h3>二、巡检记录（${D.inspections.length} 条）</h3>${rowsToTable(['日期','设备名称','巡检人','异常项','备注'],D.inspections.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{const abn=(r.items||[]).filter(i=>i.result==='异常');return[r.date,r.deviceName,r.by||'',abn.map(i=>i.name).join('、'),r.remark||'']}))}
      <h3>三、保养记录（${D.mrecords.length} 条）</h3>${rowsToTable(['日期','设备名称','保养人','保养内容','费用(元)'],D.mrecords.map(r=>[r.date,r.deviceName||'',r.by||'',r.content||'',r.cost||0]))}
      <h3>四、维修工单（${D.repairs.length} 条）</h3>${rowsToTable(['报修日期','设备名称','故障描述','状态','维修人','费用(元)'],D.repairs.map(r=>{const d=D.devices.find(x=>x.id===r.deviceId);return[r.reportDate,d?d.name:'',r.fault,r.status,r.repairer||'',r.cost||0]}))}`;
    exportWord(`设备管理综合报告_${today()}`,'车间设备管理综合报告',inner);
  },
  exportBackup:()=>exportBackup(),
  importBackup:()=>$('#fileImport').click(),
  clearAll:async()=>{
    if(!confirm('⚠️ 确定清空全部数据？此操作不可恢复，建议先导出备份。'))return;
    if(!confirm('再次确认：所有设备、巡检、保养、维修记录都会被删除！'))return;
    for(const n of STORES){if(n==='settings')continue;await reqP(store(n,'readwrite').clear());DB_DATA[n]=[]}
    render();toast('已清空全部数据');
  },
  cleanupPreview:()=>{
    const before=$('#cleanBefore').value;
    if(!before){toast('请选择日期');return}
    const c=cleanupCount(before);
    alert(`将清理此日期之前的记录：\n\n巡检：${c.insp} 条\n保养：${c.mr} 条\n维修：${c.rp} 条\n合计：${c.insp+c.mr+c.rp} 条`);
  },
  cleanupRun:async()=>{
    const before=$('#cleanBefore').value;
    if(!before){toast('请选择日期');return}
    const c=cleanupCount(before);
    const total=c.insp+c.mr+c.rp;
    if(!total){toast('没有需要清理的记录');return}
    if(!confirm(`将永久清理 ${total} 条记录（巡检 ${c.insp} + 保养 ${c.mr} + 维修 ${c.rp}），确定继续？`))return;
    const inspIds=DB_DATA.inspections.filter(x=>x.date&&x.date<before).map(x=>x.id);
    const mrIds=DB_DATA.mrecords.filter(x=>x.date&&x.date<before).map(x=>x.id);
    const rpIds=DB_DATA.repairs.filter(x=>x.reportDate&&x.reportDate<before).map(x=>x.id);
    for(const id of inspIds)await remove('inspections',id);
    for(const id of mrIds)await remove('mrecords',id);
    for(const id of rpIds)await remove('repairs',id);
    toast(`已清理 ${total} 条记录`);render();
  },
  addCheckItem:()=>{const box=$('#ciEditor');if(!box)return;const tmp=document.createElement('div');tmp.innerHTML=ciRowHTML('',0);const row=tmp.firstElementChild;box.appendChild(row);renumberCI();updateSettingCounts();const inp=row.querySelector('input');if(inp)inp.focus()},
  delCheckItem:el=>{const row=el.closest('.ci-row');if(row)row.remove();renumberCI();updateSettingCounts()},
  ciMoveUp:el=>{const row=el.closest('.ci-row');const prev=row.previousElementSibling;if(prev){row.parentNode.insertBefore(row,prev);renumberCI()}},
  ciMoveDown:el=>{const row=el.closest('.ci-row');const next=row.nextElementSibling;if(next){row.parentNode.insertBefore(next,row);renumberCI()}},
  resetCheckItems:()=>{const box=$('#ciEditor');if(!box)return;box.innerHTML=DEF_CHECK.map((it,i)=>ciRowHTML(it,i+1)).join('');updateSettingCounts();toast('已恢复默认检查项，记得保存')},
  addMaintPeriod:()=>{const box=$('#pdEditor');if(!box)return;const tmp=document.createElement('div');tmp.innerHTML=pdRowHTML('');const row=tmp.firstElementChild;box.appendChild(row);updateSettingCounts();const inp=row.querySelector('input');if(inp)inp.focus()},
  delMaintPeriod:el=>{const row=el.closest('.pd-row');if(row)row.remove();updateSettingCounts()},
  resetMaintPeriods:()=>{const box=$('#pdEditor');if(!box)return;box.innerHTML=DEF_PERIODS.map(v=>pdRowHTML(v)).join('');updateSettingCounts();toast('已恢复默认周期，记得保存')},
  addMaintTemplate:()=>{const box=$('#tmplEditor');if(!box)return;const tmp=document.createElement('div');tmp.innerHTML=tmplRowHTML({name:'',text:''});const row=tmp.firstElementChild;box.appendChild(row);updateSettingCounts();const inp=row.querySelector('.tmpl-name');if(inp)inp.focus()},
  delMaintTemplate:el=>{const row=el.closest('.tmpl-row');if(row)row.remove();updateSettingCounts()},
  resetMaintTemplates:()=>{const box=$('#tmplEditor');if(!box)return;box.innerHTML=DEF_TMPL.map(t=>tmplRowHTML(t)).join('');updateSettingCounts();toast('已恢复默认模板，记得保存')},
  addRepairPhrase:()=>{const box=$('#phrEditor');if(!box)return;const tmp=document.createElement('div');tmp.innerHTML=phraseRowHTML('');const row=tmp.firstElementChild;box.appendChild(row);updateSettingCounts();const inp=row.querySelector('input');if(inp)inp.focus()},
  delRepairPhrase:el=>{const row=el.closest('.pd-row');if(row)row.remove();updateSettingCounts()},
  resetRepairPhrases:()=>{const box=$('#phrEditor');if(!box)return;box.innerHTML=DEF_PHRASES.map(p=>phraseRowHTML(p)).join('');updateSettingCounts();toast('已恢复默认短语，记得保存')},
  saveSettings:async()=>{
    let items=$$('#ciEditor .ci-input').map(i=>i.value.trim()).filter(Boolean);
    if(!items.length)items=DEF_CHECK.slice();
    const seen=new Set(),dup=[];
    items.forEach(i=>{if(seen.has(i))dup.push(i);seen.add(i)});
    if(dup.length){toast('检查项重复：'+[...new Set(dup)].join('、'));return}
    const periods=$$('#pdEditor .pd-input').map(i=>parseInt(i.value,10)).filter(v=>v>0&&v<=3650);
    const seenP=new Set(),dupP=[];
    periods.forEach(v=>{if(seenP.has(v))dupP.push(v);seenP.add(v)});
    if(dupP.length){toast('周期选项重复：'+[...new Set(dupP)].join('、')+' 天');return}
    const finalPeriods=periods.length?periods:DEF_PERIODS.slice();
    finalPeriods.sort((a,b)=>a-b);
    let templates=$$('#tmplEditor .tmpl-row').map(row=>({name:(row.querySelector('.tmpl-name').value||'').trim(),text:(row.querySelector('.tmpl-text').value||'').trim()})).filter(t=>t.name||t.text);
    const seenT=new Set(),dupT=[];
    templates.forEach(t=>{if(t.name&&seenT.has(t.name))dupT.push(t.name);if(t.name)seenT.add(t.name)});
    if(dupT.length){toast('模板名称重复：'+[...new Set(dupT)].join('、'));return}
    if(!templates.length)templates=DEF_TMPL.map(t=>({...t}));
    let phrases=$$('#phrEditor .pd-row .ci-input').map(i=>i.value.trim()).filter(Boolean);
    if(!phrases.length)phrases=DEF_PHRASES.slice();
    const period=Math.max(1,Math.min(365,parseInt($('#setPeriod').value,10)||7));
    await save('settings',{
      workshop:$('#setWorkshop').value.trim()||'我的车间',
      inspector:$('#setInspector').value.trim(),
      inspectPeriod:period,
      theme:$('#setTheme').value,
      photoQuality:$('#setPhotoQ').value,
      checkItems:items,
      maintPeriods:finalPeriods,
      maintTemplates:templates,
      repairPhrases:phrases
    });
    applyTheme();
    toast(`已保存：${items.length} 项检查 · ${finalPeriods.length} 个周期 · ${templates.length} 条模板 · ${phrases.length} 条短语`);
    render();
  },
  addPhoto:()=>$('#filePhoto').click(),
  delPhoto:el=>{PH.splice(parseInt(el.dataset.i,10),1);renderPhotos()}
};

/* ---------- 全局事件 ---------- */
document.addEventListener('click',e=>{
  const img=e.target.closest('.ph img, .hero');
  if(img&&!e.target.closest('[data-act]')){lightbox(img.src);return}
  const pick=e.target.closest('[data-pick]');
  if(pick){
    const id=pick.dataset.pick;const cb=pickCb;pickCb=null;closeSheet();
    if(cb){const d=DB_DATA.devices.find(x=>x.id===id);setTimeout(()=>cb(d),130)}
    return;
  }
  const seg=e.target.closest('.seg-b');
  if(seg){const wrap=seg.parentElement;$$('.seg-b',wrap).forEach(x=>x.classList.remove('on'));seg.classList.add('on');return}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.act];
  if(fn){e.preventDefault();fn(el,e)}
},false);

document.addEventListener('input',e=>{
  const id=e.target&&e.target.id;
  if(id==='devSearch'){
    state.q=e.target.value;
    const list=filterDevices(state.q.trim().toLowerCase());
    const wrap=$('#devList'),cnt=$('#devCount');
    if(wrap)wrap.innerHTML=list.length?list.map(devItem).join(''):'<div class="empty">未找到匹配设备</div>';
    if(cnt)cnt.textContent=`共 ${list.length} 台设备`;
  }else if(id==='insSearch'){state.qInsp=e.target.value;updateInspList()}
  else if(id==='rpSearch'){state.qRepair=e.target.value;updateRepairList()}
  else if(id==='gsInput'){renderSearchResult(e.target.value)}
},false);

document.addEventListener('change',async e=>{
  if(e.target&&e.target.id==='filePhoto'){
    const files=Array.from(e.target.files||[]);e.target.value='';
    for(const f of files){try{PH.push(await compressImage(f))}catch(err){}}
    renderPhotos();
  }
},false);

document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='fileImport'){
    const f=e.target.files&&e.target.files[0];e.target.value='';
    if(!f)return;
    const fr=new FileReader();
    fr.onload=async()=>{
      try{
        const obj=JSON.parse(fr.result);const data=obj.data||obj;
        if(!data||!Array.isArray(data.devices))throw new Error('格式不正确');
        if(!confirm('导入将覆盖当前全部数据，确定继续吗？'))return;
        for(const n of STORES){await reqP(store(n,'readwrite').clear());DB_DATA[n]=[]}
        for(const n of ['devices','inspections','mrecords','maintenances','repairs','routes']){
          for(const item of (data[n]||[]))await save(n,item);
        }
        if(data.settings)await save('settings',data.settings);
        await loadAll();applyTheme();setRoot('home');toast('数据恢复完成 ✓');
      }catch(err){toast('导入失败：文件格式不正确')}
    };
    fr.readAsText(f);
  }
},false);

/* ---------- 启动 ---------- */
(async function init(){
  try{db=await openDB();await loadAll()}
  catch(e){
    document.getElementById('main').innerHTML=`<div class="empty">数据库初始化失败：${esc(e&&e.message)}<br><br>请通过 https 或 http 地址访问本页面（file:// 方式可能无法保存数据）。</div>`;
    return;
  }
  applyTheme();
  document.addEventListener('gesturestart',e=>e.preventDefault());
  let lastTap=0;
  document.getElementById('hdr').addEventListener('click',e=>{
    if(e.target.closest('[data-act]'))return;
    const now=Date.now();
    if(now-lastTap<320){$('#main').scrollTo({top:0,behavior:'smooth'})}
    lastTap=now;
  });
  render();
})();

/* ---------- PWA：注册 Service Worker（启用离线缓存） ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
</script>
