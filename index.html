<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="设备管理">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>车间设备管理</title>
<style>
:root,[data-theme=light]{
  --bg:#f7f8fc;--card:#fff;--card-2:#fafbfd;--text:#0f172a;--text-2:#64748b;--text-3:#94a3b8;
  --line:#eef2f7;--line-2:#e2e8f0;
  --primary:#4f46e5;--primary-2:#6366f1;--primary-3:#8b5cf6;
  --primary-soft:rgba(99,102,241,.08);--primary-glow:rgba(99,102,241,.25);
  --green:#10b981;--green-soft:rgba(16,185,129,.1);
  --orange:#f59e0b;--orange-soft:rgba(245,158,11,.12);
  --red:#ef4444;--red-soft:rgba(239,68,68,.1);
  --radius:20px;--radius-sm:14px;--radius-lg:28px;
  --shadow-1:0 1px 2px rgba(15,23,42,.04);
  --shadow-2:0 2px 8px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);
  --shadow-3:0 8px 24px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.04);
  --shadow-primary:0 4px 14px rgba(99,102,241,.25),0 1px 3px rgba(99,102,241,.15);
}
[data-theme=dark]{
  --bg:#0a0b10;--card:#14161d;--card-2:#191c24;--text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;
  --line:#1e2130;--line-2:#2a2f3e;
  --primary:#818cf8;--primary-2:#a5b4fc;--primary-3:#c4b5fd;
  --primary-soft:rgba(129,140,248,.12);--primary-glow:rgba(129,140,248,.2);
  --green:#34d399;--green-soft:rgba(52,211,153,.12);
  --orange:#fbbf24;--orange-soft:rgba(251,191,36,.12);
  --red:#f87171;--red-soft:rgba(248,113,113,.12);
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 8px 24px rgba(0,0,0,.4);
  --shadow-primary:0 4px 14px rgba(129,140,248,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;letter-spacing:-.01em}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hdr{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;flex:none;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 12px 14px;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:#fff;position:relative;overflow:hidden}
#hdr::before{content:"";position:absolute;top:-60%;right:-30%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 65%);border-radius:50%;pointer-events:none}
#hdr::after{content:"";position:absolute;bottom:-70%;left:-20%;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 65%);border-radius:50%;pointer-events:none}
#hdr h1{font-size:18px;margin:0;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em;position:relative;z-index:1}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.hdr-r{justify-content:flex-end}
.ico-btn{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;color:#fff;width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding-bottom:3px;transition:background .15s}
.ico-btn:active{background:rgba(255,255,255,.28)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 32px}
#tabbar{flex:none;display:flex;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
[data-theme=dark] #tabbar{background:rgba(20,22,29,.78)}
#tabbar button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:10px;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:color .15s}
#tabbar button .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.5);transition:filter .15s}
#tabbar button.on{color:var(--primary);font-weight:600}
#tabbar button.on .ic{filter:none}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-2);border:1px solid var(--line)}
.sec-title{font-size:13px;color:var(--text-2);margin:20px 6px 10px;display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:-.01em}
.sec-title:first-child{margin-top:0}
.sec-title .mini-tip{font-size:11px;color:var(--text-3);font-weight:400;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-2);border:1px solid var(--line)}
.stat .n{font-size:28px;font-weight:700;color:var(--primary);line-height:1.1;letter-spacing:-.03em}
.stat .l{font-size:12px;color:var(--text-2);margin-top:4px;font-weight:500}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text);font-family:inherit;box-shadow:var(--shadow-1);transition:transform .12s,box-shadow .12s;font-weight:500}
.quick button:active{transform:scale(.96);box-shadow:none}
.quick .ic{font-size:22px;line-height:1}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-2);border:1px solid var(--line);transition:transform .12s,box-shadow .12s,background .12s;animation:slideUp .3s cubic-bezier(.32,.72,0,1) both}
.item:active{transform:scale(.985);box-shadow:var(--shadow-1);background:var(--card-2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-.01em}
.item .s{font-size:12px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-lg{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--primary-soft),transparent);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;border:1px solid var(--line)}
.ic-lg img{width:100%;height:100%;object-fit:cover}
.ic-lg img.thumb{filter:blur(.4px) saturate(1.05)}
.chev{color:var(--text-3);font-size:20px;flex:none;transition:transform .12s}
.item:active .chev{transform:translateX(2px)}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-blue{background:var(--primary-soft);color:var(--primary)}
.b-gray{background:var(--line);color:var(--text-2)}
.empty{text-align:center;color:var(--text-3);font-size:13px;padding:48px 20px;animation:slideUp .4s cubic-bezier(.32,.72,0,1)}
.empty::before{content:"";display:block;width:88px;height:88px;margin:0 auto 16px;opacity:.55;background-repeat:no-repeat;background-position:center;background-size:contain;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect x='18' y='28' width='64' height='52' rx='10' fill='none' stroke='url(%23g)' stroke-width='3'/><path d='M18 46 L50 58 L82 46' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><circle cx='35' cy='40' r='2.5' fill='url(%23g)'/><circle cx='50' cy='40' r='2.5' fill='url(%23g)'/><circle cx='65' cy='40' r='2.5' fill='url(%23g)'/><path d='M30 84 L50 74 L70 84' fill='none' stroke='url(%23g)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='.5'/></svg>");
}
.hint{font-size:12px;color:var(--text-2);padding:2px 6px 10px;line-height:1.6}
.muted-sm{font-size:12px;color:var(--text-2);padding:0 6px 10px;font-weight:500}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:15px;font-family:inherit;background:linear-gradient(135deg,var(--primary-2),var(--primary-3));color:#fff;font-weight:600;flex:1;box-shadow:var(--shadow-primary);transition:transform .12s,box-shadow .12s;letter-spacing:-.01em}
.btn:active{transform:scale(.97);box-shadow:var(--shadow-1)}
.btn.wide{width:100%;display:block}
.btn.gray{background:var(--card);color:var(--text);box-shadow:var(--shadow-2);border:1px solid var(--line)}
.btn.gray:active{box-shadow:var(--shadow-1)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line-2);box-shadow:none}
.btn.danger{color:var(--red)}
.btn-row{display:flex;gap:10px;margin-bottom:12px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary-2),var(--primary-3));color:#fff;font-size:28px;border:0;box-shadow:var(--shadow-primary);z-index:20;line-height:1;padding-bottom:3px;transition:transform .15s}
.fab:active{transform:scale(.92)}
.searchbar{display:flex;gap:10px;margin-bottom:12px}
.searchbar input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s}
.searchbar input:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 4px var(--primary-soft)}
.row{display:flex;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.row:last-child{border-bottom:0}
.row .k{color:var(--text-2);flex:none;width:80px;font-weight:500}
.row .v{flex:1;word-break:break-all;font-weight:500}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;letter-spacing:-.01em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--text);font-size:15px;font-family:inherit;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s,background .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-2);background:var(--card);box-shadow:0 0 0 4px var(--primary-soft)}
.field textarea{min-height:80px;resize:vertical}
#modal{position:fixed;inset:0;display:none;z-index:100}
#modal.on{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;max-height:90vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .28s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 32px rgba(15,23,42,.12)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line);flex:none;letter-spacing:-.02em}
.sheet-hd button{background:var(--card);border:1px solid var(--line);width:32px;height:32px;border-radius:10px;font-size:16px;color:var(--text-2);display:flex;align-items:center;justify-content:center;line-height:1}
.sheet-bd{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:14px 20px;border-top:1px solid var(--line);flex:none;background:var(--card)}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check-t{flex:1;font-size:14px;font-weight:500}
.check-note{flex-basis:100%;padding:10px 12px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s}
.check-note:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--card-2)}
.seg-b{border:0;background:transparent;color:var(--text-2);font-size:12px;padding:7px 15px;font-family:inherit;font-weight:600;transition:background .15s,color .15s}
.seg-b+.seg-b{border-left:1px solid var(--line)}
.seg-b.on[data-val=正常]{background:var(--green);color:#fff}
.seg-b.on[data-val=异常]{background:var(--red);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-1)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;padding:0;backdrop-filter:blur(6px)}
.ph-add{width:78px;height:78px;border-radius:14px;border:2px dashed var(--line-2);background:var(--card-2);color:var(--text-3);font-size:26px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background .15s}
.ph-add:active{border-color:var(--primary-2);color:var(--primary);background:var(--primary-soft)}
.chk{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--primary-2)}
.chk em{color:var(--text-2);font-style:normal;font-size:12px}
.pick-list{max-height:56vh;overflow-y:auto}
.hero{width:100%;max-height:240px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;display:block;box-shadow:var(--shadow-2)}
table.rep{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
table.rep th{background:var(--card-2);color:var(--text-2);font-weight:600;padding:10px 8px;text-align:left;white-space:nowrap;font-size:11px;letter-spacing:.03em}
table.rep td{padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap;font-weight:500}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow-2);border:1px solid var(--line)}
.scan-ov{position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center}
.scan-ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:relative;width:250px;height:250px;border:3px solid #4ade80;border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);z-index:1}
.scan-tip{position:absolute;bottom:130px;color:#fff;font-size:14px;z-index:2;font-weight:500}
.scan-cancel{position:absolute;bottom:56px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px 36px;border-radius:24px;font-size:15px;z-index:2;font-family:inherit;font-weight:600}
.tagbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tagbar::-webkit-scrollbar{display:none}
.tagbar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text-2);border-radius:20px;padding:8px 16px;font-size:13px;font-family:inherit;font-weight:600;box-shadow:var(--shadow-1);transition:all .15s}
.tagbar button.on{background:linear-gradient(135deg,var(--primary-2),var(--primary-3));color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.mini-btn{border:0;background:var(--green-soft);color:var(--green);font-size:11px;padding:6px 12px;border-radius:12px;font-family:inherit;font-weight:700;flex:none}
.ci-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ci-idx{width:22px;text-align:center;font-size:12px;color:var(--text-3);flex:none;font-weight:700}
.ci-input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);color:var(--text);font-size:14px;font-family:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
.ci-input:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.ci-move{width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text-2);font-size:13px;line-height:1;padding:0;transition:all .12s}
.ci-move:active{background:var(--primary-2);color:#fff;border-color:transparent}
.ci-del{width:30px;height:30px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--red);font-size:16px;line-height:1;padding:0}
.ci-del:active{background:var(--red-soft)}
.quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-chips button{border:1px solid var(--line);background:var(--card-2);color:var(--text-2);border-radius:14px;padding:6px 13px;font-size:12px;font-family:inherit;font-weight:500;transition:all .12s}
.quick-chips button:active,.quick-chips button.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-2)}
.hdr-note{font-size:12px;color:var(--text-2);padding:4px 6px 10px;display:flex;align-items:center;gap:6px;font-weight:500}
.period-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary-2);margin-right:2px;vertical-align:1px;box-shadow:0 0 0 3px var(--primary-soft)}
.tmpl-row{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.tmpl-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tmpl-name{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;min-width:0;font-weight:600}
.tmpl-text{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;min-height:56px;resize:vertical}
.pd-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pd-input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);color:var(--text);font-size:14px;font-family:inherit;min-width:0;text-align:center;font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);backdrop-filter:blur(8px);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(15,23,42,.95);backdrop-filter:blur(12px);color:#fff;padding:12px 20px;border-radius:16px;font-size:14px;z-index:500;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.32,.72,0,1);max-width:82vw;text-align:center;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);letter-spacing:-.01em}
[data-theme=dark] #toast{background:rgba(241,245,249,.95);color:#0f172a}
#toast.show{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(251,191,36,.08));border:1px solid rgba(245,158,11,.3);color:#b45309;border-radius:16px;padding:14px 16px;font-size:13px;margin-bottom:12px;font-weight:500;box-shadow:var(--shadow-1)}

<script>
'use strict';
/* =========================================================================
   车间设备管理 PWA —— v1.9
   ========================================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtD = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const today = () => fmtD(new Date());
const daysTo = d => Math.ceil((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return fmtD(x); };
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let toastTimer = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function lightbox(src) {
  const ov = document.createElement('div');
  ov.className = 'lightbox';
  ov.innerHTML = `<img src="${src}"><button>✕</button>`;
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
}

const LAZY_PAGE = 40;
function setupLazyList(key, container, items, renderFn) {
  if (!container) return;
  const main = $('#main');
  if (main._lazyHandler) { main.removeEventListener('scroll', main._lazyHandler); main._lazyHandler = null; }
  let shown = Math.min(LAZY_PAGE, items.length);
  const hasMore = () => shown < items.length;
  function paintInitial() { container.innerHTML = items.slice(0, shown).map(renderFn).join(''); updateMoreLabel(); }
  function updateMoreLabel() {
    let lm = container.querySelector('.load-more');
    if (!hasMore()) { if (lm) lm.remove(); return; }
    if (!lm) { lm = document.createElement('div'); lm.className = 'load-more'; container.appendChild(lm); }
    lm.textContent = `已显示 ${shown}/${items.length} 条，下拉加载更多…`;
  }
  function loadMore() {
    if (!hasMore()) return;
    const lm = container.querySelector('.load-more');
    const next = items.slice(shown, shown + LAZY_PAGE);
    shown += next.length;
    const frag = document.createDocumentFragment();
    const tmp = document.createElement('div');
    tmp.innerHTML = next.map(renderFn).join('');
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    if (lm) container.insertBefore(frag, lm); else container.appendChild(frag);
    updateMoreLabel();
  }
  paintInitial();
  const handler = () => {
    if (!hasMore()) return;
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 400) loadMore();
  };
  main._lazyHandler = handler;
  main.addEventListener('scroll', handler, { passive: true });
}

function generateThumb(dataURL, maxW = 120) {
  return new Promise((res) => {
    if (!dataURL) return res('');
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.width, h = img.height;
        const tw = Math.min(maxW, w);
        const th = Math.round(h * tw / w);
        const c = document.createElement('canvas');
        c.width = tw; c.height = th;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, tw, th);
        ctx.drawImage(img, 0, 0, tw, th);
        res(c.toDataURL('image/jpeg', 0.4));
      } catch (e) { res(''); }
    };
    img.onerror = () => res('');
    img.src = dataURL;
  });
}
function thumbOf(photoField, thumbField) { return thumbField || photoField || ''; }

function applyTheme() {
  const t = DB_DATA.settings.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = dark ? '#0f1115' : '#6366f1';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((DB_DATA.settings.theme || 'auto') === 'auto') applyTheme();
});

const STORES = ['devices','inspections','mrecords','maintenances','repairs','routes','settings'];
const DEF_CHECK = ['设备外观','运行状态','异响振动','温度','润滑情况','仪表指示','安全防护','环境卫生'];
const DEF_PERIODS = [7, 15, 30, 90, 180];
const DEF_TMPL = [
  { name: '通用保养', text: '更换机油、清洁滤芯、检查皮带松紧' },
  { name: '润滑保养', text: '加注润滑脂、检查油位、紧固螺栓' },
  { name: '清洁保养', text: '清洁散热器、检查风扇、清理过滤网' },
  { name: '电气检查', text: '检查接线端子、测量绝缘电阻、紧固电气连接' }
];
const DEF_PHRASES = ['运行时有异响','轴承温度偏高','漏油','启动困难','电气故障','异常振动','密封件老化','气路堵塞'];
const DEF_SETTINGS = {
  id: 'app', workshop: '我的车间', inspector: '', theme: 'auto', photoQuality: 'medium',
  checkItems: DEF_CHECK.slice(), inspectPeriod: 7, lastBackup: '', backupRemindDays: 7,
  maintPeriods: DEF_PERIODS.slice(), maintTemplates: DEF_TMPL.map(t => ({ ...t })),
  repairPhrases: DEF_PHRASES.slice()
};
const DB_DATA = {
  devices: [], inspections: [], mrecords: [], maintenances: [], repairs: [], routes: [],
  settings: Object.assign({}, DEF_SETTINGS)
};
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('workshop_equip_db', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = (n, m) => db.transaction(n, m).objectStore(n);
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

async function loadAll() {
  const results = await Promise.all(STORES.map(async n => {
    const arr = await reqP(store(n, 'readonly').getAll());
    return [n, arr];
  }));
  for (const [n, arr] of results) {
    if (n === 'settings') {
      const raw = arr.find(x => x.id === 'app') || {};
      DB_DATA.settings = Object.assign({}, DEF_SETTINGS, raw, { id: 'app' });
      if (!Array.isArray(DB_DATA.settings.checkItems) || !DB_DATA.settings.checkItems.length) DB_DATA.settings.checkItems = DEF_CHECK.slice();
      if (!Array.isArray(DB_DATA.settings.maintPeriods) || !DB_DATA.settings.maintPeriods.length) DB_DATA.settings.maintPeriods = DEF_PERIODS.slice();
      if (!Array.isArray(DB_DATA.settings.maintTemplates) || !DB_DATA.settings.maintTemplates.length) DB_DATA.settings.maintTemplates = DEF_TMPL.map(t => ({ ...t }));
      if (!Array.isArray(DB_DATA.settings.repairPhrases) || !DB_DATA.settings.repairPhrases.length) DB_DATA.settings.repairPhrases = DEF_PHRASES.slice();
      if (!DB_DATA.settings.theme) DB_DATA.settings.theme = 'auto';
      if (!DB_DATA.settings.photoQuality) DB_DATA.settings.photoQuality = 'medium';
      if (!DB_DATA.settings.backupRemindDays) DB_DATA.settings.backupRemindDays = 7;
    } else DB_DATA[n] = arr;
  }
}
async function save(name, obj) {
  if (name === 'settings') { DB_DATA.settings = Object.assign(DB_DATA.settings, obj, { id: 'app' }); obj = DB_DATA.settings; }
  else {
    const arr = DB_DATA[name];
    const i = arr.findIndex(x => x.id === obj.id);
    if (i >= 0) arr[i] = obj; else arr.push(obj);
  }
  await reqP(store(name, 'readwrite').put(obj));
  return obj;
}
async function remove(name, id) {
  if (name === 'settings') return;
  const arr = DB_DATA[name];
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr.splice(i, 1);
  await reqP(store(name, 'readwrite').delete(id));
}
const getCheckItems = () => { const a = DB_DATA.settings.checkItems; return (Array.isArray(a) && a.length) ? a : DEF_CHECK; };
const getMaintPeriods = () => { const a = DB_DATA.settings.maintPeriods; const l = (Array.isArray(a) && a.length) ? a : DEF_PERIODS; return l.map(v => parseInt(v, 10)).filter(v => v > 0); };
const getMaintTemplates = () => { const a = DB_DATA.settings.maintTemplates; const l = (Array.isArray(a) && a.length) ? a : DEF_TMPL; return l.filter(t => t && (t.name || t.text)); };
const getRepairPhrases = () => { const a = DB_DATA.settings.repairPhrases; return (Array.isArray(a) && a.length) ? a : DEF_PHRASES.slice(); };
function deviceInspectPeriod(d) { const p = parseInt(d && d.inspectPeriod, 10); if (p > 0) return p; return Math.max(1, parseInt(DB_DATA.settings.inspectPeriod, 10) || 7); }
function getPhotoParams() {
  const q = DB_DATA.settings.photoQuality || 'medium';
  if (q === 'high') return { max: 1600, q: 0.78 };
  if (q === 'low')  return { max: 800,  q: 0.5  };
  return { max: 1200, q: 0.62 };
}

const state = { q: '', qInsp: '', qRepair: '', repairFilter: '全部', maintFilter: '计划', inspFilter: '全部' };
state.routeQueue = null;
const nav = { stack: [{ page: 'home', params: {} }] };

function render() {
  const cur = nav.stack[nav.stack.length - 1];
  const pg = PAGES[cur.page] || PAGES.home;
  const title = typeof pg.title === 'function' ? pg.title(cur.params) : (pg.title || '');
  $('#hdr').innerHTML =

    const { max, q } = getPhotoParams();
    const img = new Image();
    const fr = new FileReader();
    fr.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

function scanCode() {
  return new Promise(async resolve => {
    if (!window.BarcodeDetector) {
      const v = prompt('当前环境不支持摄像头扫码，\n请手动输入设备编号：');
      return resolve(v ? v.trim() : null);
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } }); }
    catch (e) { const v = prompt('无法访问摄像头，请手动输入设备编号：'); return resolve(v ? v.trim() : null); }
    const ov = document.createElement('div');
    ov.className = 'scan-ov';
    ov.innerHTML = `<video playsinline autoplay muted></video>
      <div class="scan-box"></div>
      <div class="scan-tip">将设备二维码放入框内</div>
      <button class="scan-cancel">取消</button>`;
    document.body.appendChild(ov);
    const video = ov.querySelector('video');
    video.srcObject = stream;
    try { await video.play(); } catch (e) {}
    let detector;
    try { detector = new BarcodeDetector({ formats: ['qr_code','code_128','code_39','ean_13','ean_8'] }); }
    catch (e) { detector = new BarcodeDetector(); }
    let done = false;
    const stop = v => {
      if (done) return; done = true;
      try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      ov.remove(); resolve(v);
    };
    ov.querySelector('.scan-cancel').onclick = () => stop(null);
    const loop = async () => {
      if (done) return;
      try {
        const cs = await detector.detect(video);
        if (cs && cs.length) return stop(cs[0].rawValue);
      } catch (e) {}
      setTimeout(loop, 280);
    };
    loop();
  });
}

    if (d.status === '停用' || d.status === '报废') return;
    const period = deviceInspectPeriod(d);
    const last = lastInspectionDate(d.id);
    const base = last || d.startDate || today();
    const gap = -daysTo(base);
    if (gap >= period) out.push({ device: d, last, gap, period, overdue: gap - period });
  });
  return out.sort((a, b) => b.overdue - a.overdue);

  if (!last) return { txt: '尚未巡检', cls: 'b-red', period, last: null, gap: null };
  const gap = -daysTo(last);
  if (gap >= period) return { txt: `已逾期 ${gap - period} 天`, cls: 'b-red', period, last, gap };

async function saveDeviceForm() {
  const id = $('#dvId').value;
  const name = $('#dvName').value.trim();
  if (!name) { toast('请填写设备名称'); return; }
  const code = $('#dvCode').value.trim();
  if (code) {
    const dup = DB_DATA.devices.find(x => x.code && x.code === code && x.id !== id);
    if (dup) { toast(`设备编号「${code}」已被「${dup.name}」占用`); return; }
  }
  const pRaw = $('#dvInspPeriod').value.trim();
  const pNum = parseInt(pRaw, 10);
  const inspectPeriod = (pRaw && pNum > 0) ? Math.min(365, pNum) : '';
  const old = id ? DB_DATA.devices.find(x => x.id === id) : null;
  const photo = PH[0] || '';
  let photoThumb = old ? (old.photoThumb || '') : '';
  if (old && old.photo !== photo) {
    photoThumb = photo ? await generateThumb(photo) : '';
  } else if (!old && photo) {
    photoThumb = await generateThumb(photo);
  }
  const obj = {
    id: id || uid(), name, code,
    model: $('#dvModel').value.trim(),
    location: $('#dvLoc').value.trim(),
    owner: $('#dvOwner').value.trim(),
    startDate: $('#dvStart').value,
    status: $('#dvStatus').value,
    inspectPeriod,
    remark: $('#dvRemark').value.trim(),
    photo,
    photoThumb
  };
  await save('devices', obj);
  closeSheet(); toast(id ? '设备已更新' : '设备已添加'); render();
}
async function delDevice(id) {
  if (!confirm('确定删除该设备吗？相关记录不会被删除。')) return;
  await remove('devices', id);

  toast('设备已删除');

function filterInspections(q, f) {
  let l = DB_DATA.inspections.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (f === '异常') l = l.filter(r => (r.items || []).some(i => i.result === '异常'));
  else if (f === '正常') l = l.filter(r => !(r.items || []).some(i => i.result === '异常'));
  if (q) l = l.filter(r => [r.deviceName, r.by, r.date].join(' ').toLowerCase().includes(q));
  return l;
}

async function saveInspection(deviceId) {
  const d = DB_DATA.devices.find(x => x.id === deviceId);
  if (!d) return;
  const items = $$('#checkList .check').map(el => {
    const on = el.querySelector('.seg-b.on');
    const note = el.querySelector('.check-note');
    return { name: el.dataset.name, result: on ? on.dataset.val : '正常', note: note ? note.value.trim() : '' };
  });
  const date = $('#insDate').value || today();
  const by = $('#insBy').value.trim();
  const rec = {
    id: uid(), deviceId: d.id, deviceName: d.name, date, by, items,
    remark: $('#insRemark').value.trim(), photos: PH.slice(), createdAt: Date.now()
  };
  await save('inspections', rec);
  if (by) await save('settings', { inspector: by });
  PH = [];
  if (state.routeQueue && state.routeQueue.ids.length) {
    state.routeQueue.idx++;
    if (state.routeQueue.idx < state.routeQueue.ids.length) {
      const nextId = state.routeQueue.ids[state.routeQueue.idx];
      nav.stack.pop(); go('inspectRun', { id: nextId });
      toast(`已完成 ${state.routeQueue.idx}/${state.routeQueue.ids.length}，继续下一台`);
      return;
    } else {
      const total = state.routeQueue.ids.length;
      const rname = state.routeQueue.name;
      state.routeQueue = null; nav.stack.pop(); render();
      toast(`路线「${rname}」全部完成，共 ${total} 台`);
      return;
    }
  }
  const period = deviceInspectPeriod(d);
  toast(`巡检已保存，下次巡检日期 ${addDays(date, period)}`);
  back();
}

function maintStatus(p) {
  if (!p.nextDate) return { txt: '未设置', cls: 'b-gray' };
  const d = daysTo(p.nextDate);
  if (d < 0) return { txt: `已逾期 ${-d} 天`, cls: 'b-red' };
  if (d === 0) return { txt: '今日到期', cls: 'b-orange' };
  if (d <= 7) return { txt: `${d} 天后到期`, cls: 'b-orange' };
  return { txt: `${d} 天后`, cls: 'b-green' };
}

    return [d ? d.name : '', r.fault, r.reporter, r.repairer].join(' ').toLowerCase().includes(q);

function buildStatRows(from, to) {
  const D = DB_DATA;
  const inR = d => d && d >= from && d <= to;
  return D.devices.map(d => {
    const ins = D.inspections.filter(x => x.deviceId === d.id && inR(x.date));
    const abn = ins.filter(x => (x.items || []).some(i => i.result === '异常')).length;
    const mr = D.mrecords.filter(x => x.deviceId === d.id && inR(x.date)).length;
    const rp = D.repairs.filter(x => x.deviceId === d.id && inR(x.reportDate));
    const cost = rp.reduce((s, x) => s + num(x.cost), 0);
    return { id: d.id, name: d.name, code: d.code, insp: ins.length, abn, mr, rep: rp.length, cost };
  }).filter(r => r.insp || r.mr || r.rep);
}
function monthlyTrend(months) {
  const res = [];
  const now = new Date();
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const insp = DB_DATA.inspections.filter(x => (x.date || '').startsWith(key)).length;
    const mr = DB_DATA.mrecords.filter(x => (x.date || '').startsWith(key)).length;
    const rp = DB_DATA.repairs.filter(x => (x.reportDate || '').startsWith(key));
    res.push({ key, insp, mr, rep: rp.length, cost: rp.reduce((s, x) => s + num(x.cost), 0) });
  }
  return res;
}
PAGES.stats = {
  title: '统计报告', tab: 'more',
  render() {
    const from = state.statFrom || (today().slice(0, 8) + '01');
    const to = state.statTo || today();
    const rows = buildStatRows(from, to);
    const totalInsp = rows.reduce((s, r) => s + r.insp, 0);
    const totalAbn = rows.reduce((s, r) => s + r.abn, 0);
    const totalMr = rows.reduce((s, r) => s + r.mr, 0);
    const totalRep = rows.reduce((s, r) => s + r.rep, 0);
    const totalCost = rows.reduce((s, r) => s + r.cost, 0);
    const trend = monthlyTrend(6);
    const maxV = Math.max(1, ...trend.map(t => Math.max(t.insp, t.mr, t.rep)));
    const topAbn = rows.slice().filter(r => r.abn > 0).sort((a, b) => b.abn - a.abn).slice(0, 5);
    const maxAbn = Math.max(1, ...topAbn.map(t => t.abn));
    return `
      <div class="card">
        <div class="btn-row" style="margin-bottom:0">
          <div class="field" style="flex:1;margin:0"><label>开始日期</label><input type="date" id="stFrom" value="${from}"></div>

      ${topAbn.length ? `

          `<div class="rank-row" data-act="goto" data-page="device" data-id="${r.id}">
            <div class="rank-idx ${i === 0 ? 'top' : ''}">${i + 1}</div>
            <div style="flex:1;min-width:0">
              <div class="rank-name">${esc(r.name)}</div>
              <div class="rank-bar"><i style="width:${Math.round(r.abn / maxAbn * 100)}%"></i></div>

            <div class="rank-val">${r.abn} 次异常</div>

      <div class="sec-title">近 6 个月趋势</div>
      <div class="table-wrap"><table class="rep">
        <thead><tr><th>月份</th><th>巡检</th><th>保养</th><th>维修</th><th>费用(元)</th></tr></thead>
        <tbody>${trend.map(t => `<tr><td>${t.key}</td>
          <td>${t.insp}<span style="display:inline-block;width:${Math.round(t.insp / maxV * 40)}px;height:6px;background:var(--primary);border-radius:3px;margin-left:6px;vertical-align:middle"></span></td>
          <td>${t.mr}<span style="display:inline-block;width:${Math.round(t.mr / maxV * 40)}px;height:6px;background:var(--green);border-radius:3px;margin-left:6px;vertical-align:middle"></span></td>
          <td>${t.rep}<span style="display:inline-block;width:${Math.round(t.rep / maxV * 40)}px;height:6px;background:var(--orange);border-radius:3px;margin-left:6px;vertical-align:middle"></span></td>
          <td>${t.cost.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
      <div class="sec-title">按设备明细 · 维修总费用 ${totalCost.toFixed(2)} 元</div>
      ${rows.length ? `<div class="table-wrap"><table class="rep">

        <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.code || '')}</td>

          <td>${r.mr}</td><td>${r.rep}</td><td>${r.cost.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">该时间段内暂无数据</div>'}
      <div class="btn-row">
        <button class="btn" data-act="exportStatExcel">导出 Excel</button>
        <button class="btn gray" data-act="exportStatWord">导出 Word</button>
      </div>

  }

const ACTIONS = {
  back: () => back(),
  closeSheet: () => closeSheet(),
  tab: el => setRoot(el.dataset.page),
  nav: el => setRoot(el.dataset.page),
  goto: el => go(el.dataset.page, el.dataset.id ? { id: el.dataset.id } : {}),
  help: () => helpSheet(),
  openSearch: () => openSearchSheet(),
  timelineOpen: el => {
    const t = el.dataset.type, id = el.dataset.id;
    if (t === 'insp') viewInspection(id);
    else if (t === 'mr') viewMRecord(id);
    else if (t === 'rp') viewRepair(id);
  },
  searchGo: el => {
    const t = el.dataset.t, id = el.dataset.id;
    closeSheet();
    setTimeout(() => {
      if (t === 'device') go('device', { id });
      else if (t === 'inspection') viewInspection(id);
      else if (t === 'repair') viewRepair(id);
      else if (t === 'maintenance') planDetail(id);
    }, 140);
  },
  addDevice: () => deviceForm(),
  editDevice: el => deviceForm(el.dataset.id),
  saveDevice: () => saveDeviceForm(),
  delDevice: el => delDevice(el.dataset.id),
  setDevPeriod: el => { $('#dvInspPeriod').value = el.dataset.v; $$('.quick-chips button[data-act="setDevPeriod"]').forEach(b => b.classList.toggle('on', b === el)); },
  clearDevPeriod: () => { $('#dvInspPeriod').value = ''; $$('.quick-chips button[data-act="setDevPeriod"]').forEach(b => b.classList.remove('on')); },
  showQR: el => showQR(el.dataset.id),
  exportDeviceArchive: el => exportDeviceArchive(el.dataset.id),
  scanDevice: async () => {
    const c = await scanCode(); if (!c) return;
    const d = findDeviceByCode(c);
    if (d) go('device', { id: d.id });
    else if (confirm(`未找到编号为「${c}」的设备，是否新增？`)) deviceForm();
  },
  scanAndInspect: async () => {
    const c = await scanCode(); if (!c) return;
    const d = findDeviceByCode(c);
    if (d) { closeSheet(); go('inspectRun', { id: d.id }); }
    else toast('未找到匹配设备：' + c);
  },
  pickInspect: () => pickInspect(),
  inspFilter: el => { state.inspFilter = el.dataset.v; render(); },
  saveInspection: el => saveInspection(el.dataset.id),
  viewInspection: el => viewInspection(el.dataset.id),
  delInspection: async el => { if (!confirm('确定删除这条巡检记录？')) return; await remove('inspections', el.dataset.id); closeSheet(); toast('已删除'); render(); },
  startInspect: el => go('inspectRun', { id: el.dataset.id }),
  fillFromLast: () => {
    const box = $('#checkList'); if (!box) return;
    let items; try { items = JSON.parse(box.dataset.lastrec || '[]'); } catch (e) { items = []; }
    if (!items.length) { toast('该设备没有历史巡检记录'); return; }
    let filled = 0;
    $$('#checkList .check').forEach(el => {
      const l = items.find(x => x.name === el.dataset.name); if (!l) return;
      el.querySelectorAll('.seg-b').forEach(b => b.classList.toggle('on', b.dataset.val === l.result));
      const note = el.querySelector('.check-note'); if (note) note.value = l.note || '';
      filled++;
    });
    toast(`已参照上次填写 ${filled} 项`);
  },
  allNormal: () => {
    $$('#checkList .check').forEach(el => {
      el.querySelectorAll('.seg-b').forEach(b => b.classList.toggle('on', b.dataset.val === '正常'));
    });
    toast('已全部标为正常');
  },
  cancelRoute: () => { state.routeQueue = null; nav.stack.pop(); render(); toast('已退出连续巡检'); },
  maintTab: el => { state.maintFilter = el.dataset.v; render(); },
  addPlan: () => planForm(),
  editPlan: el => { closeSheet(); setTimeout(() => planForm(el.dataset.id), 120); },
  savePlan: () => savePlanForm(),
  planDetail: el => planDetail(el.dataset.id),
  delPlan: async el => { if (!confirm('确定删除该保养计划？')) return; await remove('maintenances', el.dataset.id); closeSheet(); toast('已删除'); render(); },
  execMaint: el => { closeSheet(); setTimeout(() => execMaintForm(el.dataset.id), 120); },
  startMaint: async el => {
    let p = DB_DATA.maintenances.find(x => x.deviceId === el.dataset.id);
    if (!p) {
      p = { id: uid(), deviceId: el.dataset.id, period: 30, content: '', lastDate: today(), nextDate: addDays(today(), 30), remark: '' };
      await save('maintenances', p);
    }
    execMaintForm(p.id);
  },
  skipMaint: async el => {
    const p = DB_DATA.maintenances.find(x => x.id === el.dataset.id);
    if (!p) return;
    if (!confirm(`顺延「${p.content || '本次保养'}」一个周期（${p.period} 天）？\n下次日期将改为 ${addDays(today(), p.period)}`)) return;
    p.nextDate = addDays(today(), p.period);
    await save('maintenances', p);
    toast('已顺延至 ' + p.nextDate); render();
  },
  skipMaintFromDetail: async el => {
    const p = DB_DATA.maintenances.find(x => x.id === el.dataset.id);
    if (!p) return;
    if (!confirm(`顺延一个周期（${p.period} 天）？`)) return;
    p.nextDate = addDays(today(), p.period);
    await save('maintenances', p);
    closeSheet(); toast('已顺延至 ' + p.nextDate); render();
  },
  setMaintPeriod: el => {
    const v = el.dataset.v; $('#mpPeriod').value = v;
    const last = $('#mpLast').value || today();
    $('#mpNext').value = addDays(last, parseInt(v, 10));
    $$('#periodChips button').forEach(b => b.classList.toggle('on', b === el));
  },
  setMaintContent: el => {
    const i = parseInt(el.dataset.i, 10);
    const t = getMaintTemplates()[i]; if (!t) return;
    $('#mpContent').value = t.text || '';
    $$('#contentChips button').forEach(b => b.classList.toggle('on', b === el));
  },
  saveMRecord: () => saveMRecord(),
  viewMRecord: el => viewMRecord(el.dataset.id),
  delMRecord: async el => { if (!confirm('确定删除该保养记录？')) return; await remove('mrecords', el.dataset.id); closeSheet(); toast('已删除'); render(); },
  newRepair: el => repairForm(null, el.dataset.id),
  editRepair: el => { closeSheet(); setTimeout(() => repairForm(el.dataset.id), 120); },
  saveRepair: () => saveRepairForm(),
  viewRepair: el => viewRepair(el.dataset.id),
  delRepair: async el => { if (!confirm('确定删除该维修工单？')) return; await remove('repairs', el.dataset.id); closeSheet(); toast('已删除'); render(); },
  repFilter: el => { state.repairFilter = el.dataset.v; render(); },
  setRepairPhrase: el => {
    const i = parseInt(el.dataset.i, 10);
    const p = getRepairPhrases()[i]; if (!p) return;
    const ta = $('#rpFault'); if (!ta) return;
    ta.value = ta.value ? ta.value + '、' + p : p;
    $$('#faultChips button').forEach(b => b.classList.toggle('on', b === el));
  },
  quickFinish: async el => {
    const r = DB_DATA.repairs.find(x => x.id === el.dataset.id);
    if (!r) return;
    r.status = '已完成'; r.finishDate = r.finishDate || today();
    await save('repairs', r);
    const dev = DB_DATA.devices.find(x => x.id === r.deviceId);
    if (dev && dev.status === '维修中') { dev.status = '正常'; await save('devices', dev); }
    toast('工单已完成'); render();
  },
  addRoute: () => routeForm(),
  editRoute: el => { closeSheet(); setTimeout(() => routeForm(el.dataset.id), 120); },
  saveRoute: () => saveRouteForm(),
  routeDetail: el => routeDetail(el.dataset.id),
  delRoute: async el => { if (!confirm('确定删除该路线？')) return; await remove('routes', el.dataset.id); closeSheet(); toast('已删除'); render(); },
  routeInspect: el => { closeSheet(); setTimeout(() => go('inspectRun', { id: el.dataset.id }), 150); },
  routeStartAll: el => {
    const r = DB_DATA.routes.find(x => x.id === el.dataset.id);
    if (!r || !r.deviceIds || !r.deviceIds.length) { toast('该路线暂无设备'); return; }
    const ids = r.deviceIds.filter(id => DB_DATA.devices.some(d => d.id === id));
    if (!ids.length) { toast('该路线暂无有效设备'); return; }
    state.routeQueue = { ids, idx: 0, name: r.name };
    closeSheet();
    setTimeout(() => go('inspectRun', { id: ids[0] }), 150);
  },
  applyStat: () => { state.statFrom = $('#stFrom').value; state.statTo = $('#stTo').value; render(); },
  exportStatExcel: () => {
    const from = state.statFrom || (today().slice(0, 8) + '01');
    const to = state.statTo || today();
    const rows = buildStatRows(from, to);
    exportExcel(`设备统计报告_${from}_${to}`, `设备管理统计报告（${from} 至 ${to}）`,
      ['设备名称','设备编号','巡检次数','异常次数','保养次数','维修次数','维修费用(元)'],
      rows.map(r => [r.name, r.code || '', r.insp, r.abn, r.mr, r.rep, r.cost.toFixed(2)]));
  },
  exportStatWord: () => {
    const from = state.statFrom || (today().slice(0, 8) + '01');
    const to = state.statTo || today();
    const rows = buildStatRows(from, to);
    const totalInsp = rows.reduce((s, r) => s + r.insp, 0);
    const totalAbn = rows.reduce((s, r) => s + r.abn, 0);
    const totalMr = rows.reduce((s, r) => s + r.mr, 0);
    const totalRep = rows.reduce((s, r) => s + r.rep, 0);
    const totalCost = rows.reduce((s, r) => s + r.cost, 0);
    const topAbn = rows.slice().filter(r => r.abn > 0).sort((a, b) => b.abn - a.abn).slice(0, 5);
    const inner = `
      <p>车间：${esc(DB_DATA.settings.workshop || '—')}　统计区间：${from} 至 ${to}</p>
      <p><b>汇总：</b>巡检 ${totalInsp} 次，异常 ${totalAbn} 项次，保养 ${totalMr} 次，维修 ${totalRep} 单，维修费用合计 ${totalCost.toFixed(2)} 元。</p>
      ${topAbn.length ? `<p><b>异常设备排行：</b></p>${rowsToTable(['排名','设备','异常次数'], topAbn.map((r, i) => [i + 1, r.name, r.abn]))}` : ''}
      <p><b>按设备明细：</b></p>
      ${rowsToTable(['设备名称','设备编号','巡检次数','异常次数','保养次数','维修次数','维修费用(元)'],
        rows.map(r => [r.name, r.code || '', r.insp, r.abn, r.mr, r.rep, r.cost.toFixed(2)]))}`;
    exportWord(`设备统计报告_${from}_${to}`, '设备管理统计报告', inner);
  },
  devExcel: () => exportExcel(`设备台账_${today()}`, '设备台账',
    ['设备名称','设备编号','规格型号','安装位置','责任人','启用日期','巡检周期(天)','状态','备注'],
    DB_DATA.devices.map(d => [d.name, d.code || '', d.model || '', d.location || '', d.owner || '', d.startDate || '', d.inspectPeriod || '跟随全局', d.status || '', d.remark || ''])),
  devWord: () => exportWord(`设备台账_${today()}`, '设备台账',
    rowsToTable(['设备名称','设备编号','规格型号','安装位置','责任人','巡检周期(天)','状态'],
      DB_DATA.devices.map(d => [d.name, d.code || '', d.model || '', d.location || '', d.owner || '', d.inspectPeriod || '跟随全局', d.status || '']))),
  insExcel: () => exportExcel(`巡检记录_${today()}`, '巡检记录',
    ['日期','设备名称','巡检人','异常项','全部检查项','备注'],
    DB_DATA.inspections.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(r => {
      const abn = (r.items || []).filter(i => i.result === '异常');
      return [r.date, r.deviceName, r.by || '', abn.map(i => i.name).join('、'), (r.items || []).map(i => `${i.name}:${i.result}`).join('；'), r.remark || ''];
    })),
  mrExcel: () => exportExcel(`保养记录_${today()}`, '保养记录',
    ['日期','设备名称','保养人','保养内容','更换配件','费用(元)','备注'],
    DB_DATA.mrecords.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(r =>
      [r.date, r.deviceName || '', r.by || '', r.content || '', r.parts || '', r.cost || 0, r.remark || ''])),
  planExcel: () => exportExcel(`保养计划_${today()}`, '保养计划',
    ['设备名称','设备编号','保养周期(天)','上次保养','下次保养','保养内容'],
    DB_DATA.maintenances.map(p => {
      const d = DB_DATA.devices.find(x => x.id === p.deviceId);
      return [d ? d.name : '', d ? (d.code || '') : '', p.period || '', p.lastDate || '', p.nextDate || '', p.content || ''];
    })),
  rpExcel: () => exportExcel(`维修工单_${today()}`, '维修工单',
    ['报修日期','设备名称','故障描述','报修人','状态','维修人','处理结果','费用(元)','完成日期'],
    DB_DATA.repairs.slice().sort((a, b) => String(b.reportDate).localeCompare(String(a.reportDate))).map(r => {
      const d = DB_DATA.devices.find(x => x.id === r.deviceId);
      return [r.reportDate, d ? d.name : '', r.fault, r.reporter || '', r.status, r.repairer || '', r.result || '', r.cost || 0, r.finishDate || ''];
    })),
  routeWord: () => {
    const inner = DB_DATA.routes.map(r => {
      const devs = (r.deviceIds || []).map(id => DB_DATA.devices.find(d => d.id === id)).filter(Boolean);
      return `<h3>${esc(r.name)}</h3>${rowsToTable(['序号','设备名称','设备编号','安装位置'],
        devs.map((d, i) => [i + 1, d.name, d.code || '', d.location || '']))}`;
    }).join('') || '<p>暂无巡检路线</p>';
    exportWord(`巡检路线_${today()}`, '巡检路线清单', inner);
  },
  allWord: () => {
    const D = DB_DATA;
    const inner = `
      <h3>一、设备台账（${D.devices.length} 台）</h3>
      ${rowsToTable(['设备名称','设备编号','规格型号','安装位置','责任人','巡检周期(天)','状态'],
        D.devices.map(d => [d.name, d.code || '', d.model || '', d.location || '', d.owner || '', d.inspectPeriod || '跟随全局', d.status || '']))}
      <h3>二、巡检记录（${D.inspections.length} 条）</h3>
      ${rowsToTable(['日期','设备名称','巡检人','异常项','备注'],
        D.inspections.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(r => {
          const abn = (r.items || []).filter(i => i.result === '异常');
          return [r.date, r.deviceName, r.by || '', abn.map(i => i.name).join('、'), r.remark || ''];
        }))}
      <h3>三、保养记录（${D.mrecords.length} 条）</h3>
      ${rowsToTable(['日期','设备名称','保养人','保养内容','费用(元)'],
        D.mrecords.map(r => [r.date, r.deviceName || '', r.by || '', r.content || '', r.cost || 0]))}
      <h3>四、维修工单（${D.repairs.length} 条）</h3>
      ${rowsToTable(['报修日期','设备名称','故障描述','状态','维修人','费用(元)'],
        D.repairs.map(r => {
          const d = D.devices.find(x => x.id === r.deviceId);
          return [r.reportDate, d ? d.name : '', r.fault, r.status, r.repairer || '', r.cost || 0];
        }))}`;
    exportWord(`设备管理综合报告_${today()}`, '车间设备管理综合报告', inner);
  },
  exportBackup: () => exportBackup(),
  importBackup: () => $('#fileImport').click(),
  clearAll: async () => {
    if (!confirm('⚠️ 确定清空全部数据？此操作不可恢复，建议先导出备份。')) return;
    if (!confirm('再次确认：所有设备、巡检、保养、维修记录都会被删除！')) return;
    for (const n of STORES) { if (n === 'settings') continue; await reqP(store(n, 'readwrite').clear()); DB_DATA[n] = []; }
    render(); toast('已清空全部数据');
  },
  cleanupPreview: () => {
    const before = $('#cleanBefore').value;
    if (!before) { toast('请选择日期'); return; }
    const c = cleanupCount(before);
    alert(`将清理此日期之前的记录：\n\n巡检：${c.insp} 条\n保养：${c.mr} 条\n维修：${c.rp} 条\n合计：${c.insp + c.mr + c.rp} 条`);
  },
  cleanupRun: async () => {
    const before = $('#cleanBefore').value;
    if (!before) { toast('请选择日期'); return; }
    const c = cleanupCount(before);
    const total = c.insp + c.mr + c.rp;
    if (!total) { toast('没有需要清理的记录'); return; }
    if (!confirm(`将永久清理 ${total} 条记录（巡检 ${c.insp} + 保养 ${c.mr} + 维修 ${c.rp}），确定继续？`)) return;
    const inspIds = DB_DATA.inspections.filter(x => x.date && x.date < before).map(x => x.id);
    const mrIds = DB_DATA.mrecords.filter(x => x.date && x.date < before).map(x => x.id);
    const rpIds = DB_DATA.repairs.filter(x => x.reportDate && x.reportDate < before).map(x => x.id);
    for (const id of inspIds) await remove('inspections', id);
    for (const id of mrIds) await remove('mrecords', id);
    for (const id of rpIds) await remove('repairs', id);
    toast(`已清理 ${total} 条记录`); render();
  },
  addCheckItem: () => { const box = $('#ciEditor'); if (!box) return; const tmp = document.createElement('div'); tmp.innerHTML = ciRowHTML('', 0); const row = tmp.firstElementChild; box.appendChild(row); renumberCI(); updateSettingCounts(); const inp = row.querySelector('input'); if (inp) inp.focus(); },
  delCheckItem: el => { const row = el.closest('.ci-row'); if (row) row.remove(); renumberCI(); updateSettingCounts(); },
  ciMoveUp: el => { const row = el.closest('.ci-row'); const prev = row.previousElementSibling; if (prev) { row.parentNode.insertBefore(row, prev); renumberCI(); } },
  ciMoveDown: el => { const row = el.closest('.ci-row'); const next = row.nextElementSibling; if (next) { row.parentNode.insertBefore(next, row); renumberCI(); } },
  resetCheckItems: () => { const box = $('#ciEditor'); if (!box) return; box.innerHTML = DEF_CHECK.map((it, i) => ciRowHTML(it, i + 1)).join(''); updateSettingCounts(); toast('已恢复默认检查项，记得保存'); },
  addMaintPeriod: () => { const box = $('#pdEditor'); if (!box) return; const tmp = document.createElement('div'); tmp.innerHTML = pdRowHTML(''); const row = tmp.firstElementChild; box.appendChild(row); updateSettingCounts(); const inp = row.querySelector('input'); if (inp) inp.focus(); },
  delMaintPeriod: el => { const row = el.closest('.pd-row'); if (row) row.remove(); updateSettingCounts(); },
  resetMaintPeriods: () => { const box = $('#pdEditor'); if (!box) return; box.innerHTML = DEF_PERIODS.map(v => pdRowHTML(v)).join(''); updateSettingCounts(); toast('已恢复默认周期，记得保存'); },
  addMaintTemplate: () => { const box = $('#tmplEditor'); if (!box) return; const tmp = document.createElement('div'); tmp.innerHTML = tmplRowHTML({ name: '', text: '' }); const row = tmp.firstElementChild; box.appendChild(row); updateSettingCounts(); const inp = row.querySelector('.tmpl-name'); if (inp) inp.focus(); },
  delMaintTemplate: el => { const row = el.closest('.tmpl-row'); if (row) row.remove(); updateSettingCounts(); },
  resetMaintTemplates: () => { const box = $('#tmplEditor'); if (!box) return; box.innerHTML = DEF_TMPL.map(t => tmplRowHTML(t)).join(''); updateSettingCounts(); toast('已恢复默认模板，记得保存'); },
  addRepairPhrase: () => { const box = $('#phrEditor'); if (!box) return; const tmp = document.createElement('div'); tmp.innerHTML = phraseRowHTML(''); const row = tmp.firstElementChild; box.appendChild(row); updateSettingCounts(); const inp = row.querySelector('input'); if (inp) inp.focus(); },
  delRepairPhrase: el => { const row = el.closest('.pd-row'); if (row) row.remove(); updateSettingCounts(); },
  resetRepairPhrases: () => { const box = $('#phrEditor'); if (!box) return; box.innerHTML = DEF_PHRASES.map(p => phraseRowHTML(p)).join(''); updateSettingCounts(); toast('已恢复默认短语，记得保存'); },
  saveSettings: async () => {
    let items = $$('#ciEditor .ci-input').map(i => i.value.trim()).filter(Boolean);
    if (!items.length) items = DEF_CHECK.slice();
    const seen = new Set(), dup = [];
    items.forEach(i => { if (seen.has(i)) dup.push(i); seen.add(i); });
    if (dup.length) { toast('检查项重复：' + [...new Set(dup)].join('、')); return; }
    const periods = $$('#pdEditor .pd-input').map(i => parseInt(i.value, 10)).filter(v => v > 0 && v <= 3650);
    const seenP = new Set(), dupP = [];
    periods.forEach(v => { if (seenP.has(v)) dupP.push(v); seenP.add(v); });
    if (dupP.length) { toast('周期选项重复：' + [...new Set(dupP)].join('、') + ' 天'); return; }
    const finalPeriods = periods.length ? periods : DEF_PERIODS.slice();
    finalPeriods.sort((a, b) => a - b);
    let templates = $$('#tmplEditor .tmpl-row').map(row => ({
      name: (row.querySelector('.tmpl-name').value || '').trim(),
      text: (row.querySelector('.tmpl-text').value || '').trim()
    })).filter(t => t.name || t.text);
    const seenT = new Set(), dupT = [];
    templates.forEach(t => { if (t.name && seenT.has(t.name)) dupT.push(t.name); if (t.name) seenT.add(t.name); });
    if (dupT.length) { toast('模板名称重复：' + [...new Set(dupT)].join('、')); return; }
    if (!templates.length) templates = DEF_TMPL.map(t => ({ ...t }));
    let phrases = $$('#phrEditor .pd-row .ci-input').map(i => i.value.trim()).filter(Boolean);
    if (!phrases.length) phrases = DEF_PHRASES.slice();
    const period = Math.max(1, Math.min(365, parseInt($('#setPeriod').value, 10) || 7));
    const bDays = Math.max(1, Math.min(90, parseInt($('#setBackupDays').value, 10) || 7));
    await save('settings', {
      workshop: $('#setWorkshop').value.trim() || '我的车间',
      inspector: $('#setInspector').value.trim(),
      inspectPeriod: period,
      backupRemindDays: bDays,
      theme: $('#setTheme').value,
      photoQuality: $('#setPhotoQ').value,
      checkItems: items,
      maintPeriods: finalPeriods,
      maintTemplates: templates,
      repairPhrases: phrases
    });
    applyTheme();
    toast(`已保存：${items.length} 项检查 · ${finalPeriods.length} 个周期 · ${templates.length} 条模板 · ${phrases.length} 条短语`);
    render();
  },
  addPhoto: () => $('#filePhoto').click(),
  delPhoto: el => { PH.splice(parseInt(el.dataset.i, 10), 1); renderPhotos(); }
};

document.addEventListener('click', e => {
  const img = e.target.closest('.ph img, .hero');
  if (img && !e.target.closest('[data-act]')) { lightbox(img.src); return; }
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const id = pick.dataset.pick;
    const cb = pickCb; pickCb = null;
    closeSheet();
    if (cb) { const d = DB_DATA.devices.find(x => x.id === id); setTimeout(() => cb(d), 130); }
    return;
  }
  const seg = e.target.closest('.seg-b');
  if (seg) {
    const wrap = seg.parentElement;
    $$('.seg-b', wrap).forEach(x => x.classList.remove('on'));
    seg.classList.add('on');
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
}, false);

const devSearchHandler = debounce(v => {
  state.q = v;
  const list = filterDevices(v.trim().toLowerCase());
  const box = $('#devList');
  if (box) setupLazyList('devices', box, list, devItem);
  const cnt = $('#devCount');
  if (cnt) cnt.textContent = `共 ${list.length} 台设备`;
}, 200);
const insSearchHandler = debounce(v => { state.qInsp = v; updateInspList(); }, 200);
const repSearchHandler = debounce(v => { state.qRepair = v; updateRepairList(); }, 200);

document.addEventListener('input', e => {
  const id = e.target && e.target.id;
  if (id === 'devSearch') devSearchHandler(e.target.value);
  else if (id === 'insSearch') insSearchHandler(e.target.value);
  else if (id === 'rpSearch') repSearchHandler(e.target.value);
  else if (id === 'gsInput') renderSearchResult(e.target.value);
}, false);

document.addEventListener('change', async e => {
  if (e.target && e.target.id === 'filePhoto') {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const f of files) { try { PH.push(await compressImage(f)); } catch (err) {} }
    renderPhotos();
  }
}, false);

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'fileImport') {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const obj = JSON.parse(fr.result);
        const data = obj.data || obj;
        if (!data || !Array.isArray(data.devices)) throw new Error('格式不正确');
        if (!confirm('导入将覆盖当前全部数据，确定继续吗？')) return;
        for (const n of STORES) { await reqP(store(n, 'readwrite').clear()); DB_DATA[n] = []; }
        for (const n of ['devices','inspections','mrecords','maintenances','repairs','routes']) {
          for (const item of (data[n] || [])) await save(n, item);
        }
        if (data.settings) await save('settings', data.settings);
        await loadAll();
        applyTheme();
        setRoot('home');
        toast('数据恢复完成 ✓');
      } catch (err) { toast('导入失败：文件格式不正确'); }
    };
    fr.readAsText(f);
  }
}, false);

async function boot() {
  const bootStartTime = Date.now();


  /* 打开数据库 + 并行加载数据 */
  try { db = await openDB(); await loadAll(); }
  catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="empty">数据库初始化失败：${esc(e && e.message)}<br><br>请通过 https 或 http 地址访问。</div>`;
    hideSplash(bootStartTime);
    return;
  }

  applyTheme();

  function handleHash() {
    const h = location.hash || '';
    const m = h.match(/^#\/inspect\/([a-zA-Z0-9]+)/);
    if (m) {
      const did = m[1];
      const d = DB_DATA.devices.find(x => x.id === did);
      if (d) {
        nav.stack = [{ page: 'inspectRun', params: { id: did } }];
        render();
        history.replaceState(null, '', location.pathname);
        return;
      } else {
        toast('未找到该设备');
      }
    }
    render();
  }
  handleHash();

  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTap = 0;
  document.getElementById('hdr').addEventListener('click', e => {
    if (e.target.closest('[data-act]')) return;
    const now = Date.now();
    if (now - lastTap < 320) { $('#main').scrollTo({ top: 0, behavior: 'smooth' }); }
    lastTap = now;
  });

  /* Service Worker 后台注册 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  }

  hideSplash(bootStartTime);
}

function hideSplash(bootStartTime) {
  const MIN_SHOW = 900;
  const elapsed = Date.now() - bootStartTime;
  const wait = Math.max(0, MIN_SHOW - elapsed);
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) {
      s.classList.add('hide');
      setTimeout(() => s.remove(), 500);
    }
  }, wait);
}

boot();
</script>
</body>
